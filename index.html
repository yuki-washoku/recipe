function kindOf(entry){
  const k = entry && entry.kind;
  return KINDS[k] ? k : 'recipe';
}
function kindConf(entry){
  return KINDS[kindOf(entry)];
}

// Checklist ticks are personal and short-lived, so they live on the device
// rather than in the shared database (no write cost, no conflicts between
// staff, and they reset on their own each day).
function checkKey(entryId){
  return `chk:${entryId}:${new Date().toISOString().slice(0,10)}`;
}
function getChecks(entryId){
  try{
    const raw = window.localStorage.getItem(checkKey(entryId));
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function setChecks(entryId, arr){
  try{ window.localStorage.setItem(checkKey(entryId), JSON.stringify(arr)); }
  catch(e){}
}
function clearOldChecks(){
  try{
    const today = new Date().toISOString().slice(0,10);
    for(let i = window.localStorage.length - 1; i >= 0; i--){
      const k = window.localStorage.key(i);
      if(k && k.startsWith('chk:') && !k.endsWith(today)){
        window.localStorage.removeItem(k);
      }
    }
  }catch(e){}
}

// Menu rows pair a dish name with an optional link to a recipe entry.
// Stock rows carry a quantity and a reorder point, which is what drives the
// ordering alerts.
// Ingredients are already written down all over the notebook — in recipe
// ingredient lists and after the "／" in menu lines. Rather than retyping them,
// candidates are gathered from there.
const STOCK_STOPWORDS = new Set([
  '日替り','焼魚','前菜','吸物','造里','煮物','焼物','揚物','強肴','食事','香の物',
  '留椀','甘味','先付','お通し','お造り','サラダ','逸品','デザート','蒸籠蒸し',
  'かご盛り','主菜','副菜','小鉢','漬物','そば','一式','盛合せ','適量','少々'
]);

function stockCandidates(scope){
  const found = new Map();   // normalised -> display name
  const add = (raw)=>{
    let t = String(raw||'').trim()
      .replace(/[（(].*?[)）]/g, '')     // drop parenthetical notes
      .replace(/\d+(\.\d+)?\s*(g|kg|cc|ml|l|本|個|枚|束|丁|パック|切|ヶ|人前)?/gi, '')
      .replace(/[　\s]+/g, ' ')
      .trim();
    if(!t || t.length < 2 || t.length > 14) return;
    if(STOCK_STOPWORDS.has(t)) return;
    const key = t.replace(/[　\s]/g,'');
    if(!found.has(key)) found.set(key, t);
  };

  state.recipes.forEach(r=>{
    const k = kindOf(r);
    if(k === 'inventory') return;
    // Only look at the menus this inventory list is for.
    if(scope && scope !== 'all' && k !== scope) return;

    // Recipe-style ingredient lists are the cleanest source.
    (r.ingredients||[]).forEach(i=>add(i && i.name));

    // Menu lines: everything after the dish name tends to be the garnish and
    // ingredient list, separated by slashes and spaces.
    (r.menu||[]).forEach(mrow=>{
      const parts = String((mrow && mrow.name) || '').split(/[／/]/).slice(1);
      parts.forEach(seg=>seg.split(/[、,･・\s　]+/).forEach(add));
    });
  });

  // Anything already tracked anywhere is not a candidate.
  const known = new Set();
  state.recipes
    .filter(r=>kindOf(r)==='inventory' && (r.scope||'all') === (scope||'all'))
    .forEach(r=>normalizeStock(r.stock).forEach(s=>known.add(s.name.replace(/[　\s]/g,''))));
  (state.draft && state.draft.stock || []).forEach(s=>known.add(String(s.name||'').replace(/[　\s]/g,'')));

  return Array.from(found.entries())
    .filter(([key])=>!known.has(key))
    .map(([,name])=>name)
    .sort((a,b)=>jaCollator.compare(a,b));
}

const BULK_SCOPES = ['lunch','hirukaiseki','obanzai','kaiseki'];

async function createScopedInventories(){
  if(!canEdit()) return;
  const existing = new Set(
    state.recipes.filter(r=>kindOf(r)==='inventory').map(r=>r.scope||'all')
  );
  const todo = BULK_SCOPES.filter(s=>!existing.has(s));
  if(!todo.length){
    state.banner = {type:'info', text:'献立別の在庫表はすでに作成済みです。'};
    render();
    return;
  }

  let made = 0, items = 0;
  for(const scope of todo){
    const names = stockCandidates(scope);
    const entry = emptyDraft();
    entry.id = uid();
    entry.kind = 'inventory';
    entry.scope = scope;
    entry.title = `${scopeLabel(scope)}の在庫`;
    entry.reading = '';
    entry.servings = '';
    entry.ingredients = [];
    entry.steps = [];
    entry.menu = [];
    entry.stock = names.map(n=>({ name:n, qty:0, min:0, unit:'' }));
    entry.createdAt = new Date().toISOString();
    try{
      await saveRecipe(entry);
      made++; items += entry.stock.length;
    }catch(e){ /* keep going with the others */ }
  }
  state.banner = {type:'success',
    text:`${made}つの在庫表を作成し、献立から ${items} 品目を取り込みました。在庫数と発注点を入力してください。`};
  render();
}

// collects ingredients from the menus it serves.
const STOCK_SCOPES = [
  { key:'lunch',       label:'昼の定食' },
  { key:'hirukaiseki', label:'昼の会席' },
  { key:'obanzai',     label:'おばんざい' },
  { key:'kaiseki',     label:'夜の会席' },
  { key:'makanai',     label:'賄い' },
  { key:'alacarte',    label:'単品料理' },
  { key:'all',         label:'すべての献立' }
];
function scopeLabel(key){
  const s = STOCK_SCOPES.find(x=>x.key===key);
  return s ? s.label : 'すべての献立';
}

function normalizeStock(stock){
  if(!Array.isArray(stock)) return [];
  return stock
    .filter(s=>s && String(s.name||'').trim())
    .map(s=>({
      name: String(s.name||'').trim(),
      qty: Number.isFinite(+s.qty) ? +s.qty : 0,
      min: Number.isFinite(+s.min) ? +s.min : 0,
      par: Number.isFinite(+s.par) ? +s.par : 0,
      unit: String(s.unit||'').trim()
    }));
}

// Only items with a reorder point set can need ordering. Without this, a
// freshly created list (everything at 0 with no reorder point) lit up every
// single item as needing an order.
function needsOrder(s){
  const min = +s.min || 0;
  if(min <= 0) return false;
  return (+s.qty || 0) <= min;
}

function lowStockCount(entry){
  return normalizeStock(entry && entry.stock).filter(needsOrder).length;
}

// Total across the notebook, used for the alert badge.
function totalLowStock(){
  return state.recipes
    .filter(r=>kindOf(r)==='inventory')
    .reduce((n,r)=>n + lowStockCount(r), 0);
}


// ---------------------------------------------------------------------------
// Inventory
//
// The old list could only be changed with ± buttons, one tap per unit, and each
// tap wrote to the database — counting a shelf of 12 meant twelve writes. It
// also said only THAT something needed ordering, never how much, and a long
// list buried the few items that mattered. What follows replaces that with
// direct entry, a stocktake mode that saves once, and an order list that can be
// handed to a supplier.

// How much to order. With a 適正在庫 (par level) set we can say the real order
// quantity; without one we can only state the shortfall against the reorder
// point, and the wording says which it is rather than inventing a number.
function orderGap(s){
  const qty = +s.qty || 0;
  const min = +s.min || 0;
  const par = +s.par || 0;
  if(par > 0 && qty < par) return { amount: Math.round((par - qty) * 100) / 100, kind: 'order' };
  if(min > 0 && qty <= min) return { amount: Math.round((min - qty) * 100) / 100, kind: 'short' };
  return { amount: 0, kind: 'none' };
}

function stockUi(){
  if(!state.stockUi) state.stockUi = { filter:'all', sort:'low', counting:false, draft:null };
  return state.stockUi;
}

function sortedStockRows(rows){
  const ui = stockUi();
  // Keep the original position so edits can be written back to the right row.
  const withIdx = rows.map((s,i)=>({ s, i }));
  const visible = ui.filter === 'low' ? withIdx.filter(x=>needsOrder(x.s)) : withIdx;
  if(ui.sort === 'name'){
    return visible.slice().sort((a,b)=>String(a.s.name).localeCompare(String(b.s.name),'ja'));
  }
  // low stock first, then the rest in their own order
  return visible.slice().sort((a,b)=>{
    const la = needsOrder(a.s) ? 0 : 1, lb = needsOrder(b.s) ? 0 : 1;
    return la !== lb ? la - lb : a.i - b.i;
  });
}

// Plain text an order can actually be sent with.
function orderListText(r, rows){
  const low = rows.filter(needsOrder);
  if(!low.length) return '';
  const head = `【発注】${r.title || ''}（${scopeLabel(r.scope)}）  ${new Date().toLocaleDateString('ja-JP')}`;
  const lines = low.map(s=>{
    const g = orderGap(s);
    const u = s.unit || '';
    const amount = g.amount > 0
      ? (g.kind === 'order' ? `${g.amount}${u}` : `${g.amount}${u}以上`)
      : '要確認';
    return `・${s.name}  ${amount}  （在庫 ${s.qty}${u} / 発注点 ${s.min}${u}${(+s.par||0) ? ` / 適正 ${s.par}${u}` : ''}）`;
  });
  return [head, ...lines].join('\n');
}

          <span class="stock-min">発注点 ${s.min}${esc(s.unit||'')}</span>

  ` : `
    <ul class="stock-view">
      ${shown.map(({s,i})=>{
        const g = orderGap(s);
        const u = esc(s.unit||'');
        return `
        <li class="${needsOrder(s)?'low':''}">
          <span class="stock-name">${esc(s.name)}</span>

  return `${summary}<div class="section-label">${esc(DK.stockLabel)}</div>${toolbar}${body}`;

function wireStockPanel(slot, r){
  slot.querySelectorAll('[data-stockfilter]').forEach(el=>{
    el.onclick = ()=>{ stockUi().filter = el.dataset.stockfilter; render(); };
  });
  slot.querySelectorAll('[data-stocksort]').forEach(el=>{
    el.onclick = ()=>{ stockUi().sort = el.dataset.stocksort; render(); };
  });

  const toggle = slot.querySelector('#toggle-count');
  if(toggle) toggle.onclick = ()=>{ stockUi().counting = !stockUi().counting; render(); };
  const cancel = slot.querySelector('#cancel-count');
  if(cancel) cancel.onclick = ()=>{ stockUi().counting = false; render(); };

  const copyBtn = slot.querySelector('#copy-order');
  if(copyBtn) copyBtn.onclick = async ()=>{
    const text = orderListText(r, normalizeStock(r.stock));
    const ok = await copyPlainText(text);
    copyBtn.textContent = ok ? 'コピーしました' : 'コピーできませんでした';
    setTimeout(()=>{ copyBtn.textContent = '発注リストをコピー'; }, 1800);
  };

  // Direct entry. The write is delayed until typing stops so that counting
  // "12" is one write, not two, and never one per keystroke.
  let timer = null;
  const commit = async (idx, value)=>{
    const rows = normalizeStock(r.stock);
    if(!rows[idx]) return;
    const n = parseFloat(value);
    rows[idx].qty = Number.isFinite(n) ? Math.max(0, n) : 0;
    try{
      await saveRecipe(Object.assign({}, r, { stock: rows }));
    }catch(e){
      state.banner = { type:'error', text:'更新できませんでした: ' + (e && e.message ? e.message : '') };
      render();
    }
  };
  slot.querySelectorAll('[data-qtyidx]').forEach(el=>{
    const idx = parseInt(el.dataset.qtyidx, 10);
    el.oninput = ()=>{ clearTimeout(timer); timer = setTimeout(()=>commit(idx, el.value), 900); };
    el.onblur = ()=>{ clearTimeout(timer); commit(idx, el.value); };
    el.onkeydown = (ev)=>{ if(ev.key === 'Enter'){ ev.preventDefault(); el.blur(); } };
  });

  const saveCount = slot.querySelector('#save-count');
  if(saveCount) saveCount.onclick = async ()=>{
    const status = slot.querySelector('#count-status');
    const rows = normalizeStock(r.stock);
    let changed = 0;
    slot.querySelectorAll('[data-countidx]').forEach(el=>{
      const i = parseInt(el.dataset.countidx, 10);
      if(!rows[i]) return;
      const n = parseFloat(el.value);
      const v = Number.isFinite(n) ? Math.max(0, n) : 0;
      if(v !== rows[i].qty){ rows[i].qty = v; changed++; }
    });
    if(!changed){
      if(status){ status.textContent = '変更はありませんでした。'; status.style.color = 'var(--ink-soft)'; }
      return;
    }
    saveCount.disabled = true;
    if(status){ status.textContent = '保存中…'; status.style.color = 'var(--ink-soft)'; }
    try{
      await saveRecipe(Object.assign({}, r, { stock: rows }));   // one write for the whole shelf
      stockUi().counting = false;
      state.banner = { type:'success', text:`棚卸しを保存しました（${changed}品目を更新）` };
      render();
    }catch(e){
      if(status){ status.textContent = '保存できませんでした: ' + (e && e.message ? e.message : ''); status.style.color = 'var(--clay)'; }
      saveCount.disabled = false;
    }
  };
}

function normalizeMenu(menu){
  if(!Array.isArray(menu)) return [];
  return menu
    .filter(m=>m && (String(m.name||'').trim() || m.recipeId))
    .map(m=>({ name: String(m.name||'').trim(), recipeId: m.recipeId || '' }));
}

// Menus are written with the course written in front of the dish
// ("先付　胡麻豆腐"), so the prefix is stripped before matching.
const COURSE_PREFIXES = [
  '先付','前菜','八寸','椀物','吸物','汁物','向付','造り','お造り','刺身',
  '焼物','揚物','煮物','炊合せ','炊き合わせ','蒸物','酢の物','強肴','進肴',
  '食事','御飯','ご飯','香の物','水菓子','甘味','デザート',
  '主菜','副菜','小鉢','漬物','果物',
  // Labels used by the lunch sheets and the banquet plans. Without these a
  // line like "日替り　若鶏唐揚げ" could never match the recipe "若鶏唐揚げ".
  '日替り','日替わり','焼魚','焼き魚','旬菜','サラダ','逸品','かご盛り',
  '蒸籠蒸し','そば','麺','一品'
];

function menuMatchKey(s){
  let t = String(s||'').replace(/[\s　]/g,'').toLowerCase();
  for(const p of COURSE_PREFIXES){
    const pl = p.toLowerCase();
    if(t.startsWith(pl) && t.length > pl.length){
      t = t.slice(pl.length);
      break;
    }
  }
  // Everything after the first separator is the garnish, not the dish.
  t = t.split('／')[0].split('/')[0];
  return t;
}

// The menus are written by hand, so the same dish appears as "ホッケ塩焼き"
// one week and "ほっけ塩焼" the next. A looser key absorbs the spellings that
// actually occur: kana script, okurigana, a trailing 焼, and the 真 of 真鯖 /
// 真鱈. It is only ever used as a fallback, and only when it picks out exactly
// one recipe, so it cannot quietly link the wrong dish.
const MATCH_SYNONYMS = [
  ['カキ', '牡蠣'],
  ['サワラ', '鰆'],
  ['サバ', '鯖'],
  ['カレイ', '鰈']
];

function looseMatchKey(s){
  let t = String(s||'');
  for(const [from, to] of MATCH_SYNONYMS) t = t.split(from).join(to);
  t = menuMatchKey(t);
  // katakana to hiragana
  t = t.replace(/[\u30A1-\u30F6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  t = t.replace(/^真/, '');        // 真鯖 / 真鱈 are written both ways
  t = t.replace(/[きげり]$/, '');  // 焼き / 揚げ / 盛り
  t = t.replace(/焼$/, '');        // 目抜西京 vs 目抜西京焼
  return t;
}

// If a dish name matches an existing recipe, link it automatically so the
// person doesn't have to pick it from the list every time.
function autoLinkMenu(menu){
  const recipes = state.recipes.filter(r => kindOf(r) === 'recipe');
  return (menu||[]).map(m=>{
    if(m.recipeId) return m;
    const key = menuMatchKey(m.name);
    if(!key) return m;

    let hit = recipes.find(r => menuMatchKey(r.title) === key);

    if(!hit){
      const lk = looseMatchKey(m.name);
      if(lk){
        const near = recipes.filter(r => looseMatchKey(r.title) === lk);
        if(near.length === 1) hit = near[0];   // ambiguous: leave it alone
      }
    }

    return hit ? { name: m.name, recipeId: hit.id } : m;
  });
}

// A single menu line often lists several dishes ("前菜　A／B／C"), so it is
// split before offering to create a recipe.
function splitDishes(line){
  const withoutCourse = String(line||'')
    .replace(/^[^\s　]+[\s　]+/, m => COURSE_PREFIXES.includes(m.trim()) ? '' : m);
  return withoutCourse
    .split(/[／/・]/)
    .map(s=>s.trim())
    .filter(Boolean);
}

function menuLinkTarget(recipeId){
  return state.recipes.find(r => r.id === recipeId) || null;
}

const SECTION_GROUPS = [

  { title:'仕込み・段取り', keys:['tasklib','schedule','inventory','order','routine'] },

function openSectionPicker(){
  const overlay = document.createElement('div');
  overlay.className = 'sec-overlay';

  const countOf = k => k === 'all'
    ? state.recipes.length
    : state.recipes.filter(r=>kindOf(r)===k).length;

  // Anything not listed in a group is still shown, so a new section can never
  // become unreachable by being forgotten here.
  const grouped = new Set(SECTION_GROUPS.flatMap(g=>g.keys));
  const leftovers = Object.keys(KINDS).filter(k=>!grouped.has(k));

  const tile = k => KINDS[k] ? `
    <button class="sec-tile ${state.section===k?'active':''}" data-pick="${k}">
      <span>${esc(KINDS[k].label)}${k==='inventory' && totalLowStock() ? ` <span class="sec-alert">${totalLowStock()}</span>` : ''}</span>
      <span class="sec-tile-count">${countOf(k)}</span>
    </button>` : '';

  overlay.innerHTML = `
    <div class="sec-sheet">
      <div class="sec-sheet-head">
        <strong>表示する項目</strong>
        <button class="sec-close" aria-label="閉じる">✕</button>
      </div>
      <div class="sec-scroll">
        ${SECTION_GROUPS.map(g=>`
          <div class="sec-group">
            <div class="sec-group-title">${esc(g.title)}</div>
            <div class="sec-tiles">${g.keys.map(tile).join('')}</div>
          </div>
        `).join('')}
        ${leftovers.length ? `
          <div class="sec-group">
            <div class="sec-group-title">その他</div>
            <div class="sec-tiles">${leftovers.map(tile).join('')}</div>
          </div>` : ''}
        <div class="sec-group">
          <div class="sec-tiles">
            <button class="sec-tile wide ${state.section==='all'?'active':''}" data-pick="all">
              <span>すべて表示</span>
              <span class="sec-tile-count">${countOf('all')}</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  `;

  const close = ()=>{
    document.removeEventListener('keydown', onKey);
    overlay.remove();
  };
  const onKey = e => { if(e.key === 'Escape') close(); };

  overlay.onclick = e => { if(e.target === overlay) close(); };
  overlay.querySelector('.sec-close').onclick = close;
  overlay.querySelectorAll('[data-pick]').forEach(b=>{
    b.onclick = ()=>{ close(); switchSection(b.dataset.pick); };
  });

  document.addEventListener('keydown', onKey);
  document.body.appendChild(overlay);
}

const JP_DAYS = ['日','月','火','水','木','金','土'];

function todayLabel(){
  const n = new Date();
  return `${n.getFullYear()}/${String(n.getMonth()+1).padStart(2,'0')}/${String(n.getDate()).padStart(2,'0')}（${JP_DAYS[n.getDay()]}）`;
}
// おばんざい rotate weekly, so the current Monday-to-Friday range is offered
// in the same shorthand the kitchen already writes ("2026年 8/31〜9/4").
function thisWeekLabel(){
  const n = new Date();
  const dow = n.getDay();                 // 0=Sun
  const offsetToMon = (dow === 0) ? -6 : (1 - dow);
  const mon = new Date(n); mon.setDate(n.getDate() + offsetToMon);
  const fri = new Date(mon); fri.setDate(mon.getDate() + 4);
  const md = d => `${d.getMonth()+1}/${d.getDate()}`;
  return `${mon.getFullYear()}年 ${md(mon)}〜${md(fri)}`;
}

function thisMonthLabel(){
  const n = new Date();
  return `${n.getFullYear()}年${n.getMonth()+1}月`;
}

function openAdd(){
  const d = emptyDraft();
  // Adding from inside a section should create that kind of entry.
  if(state.section && state.section !== 'all') d.kind = state.section;

  // These two are dated records kept day after day / month after month, so
  // pre-filling the date and title removes most of the typing.
  if(d.kind === 'lunch'){
    const t = todayLabel();
    d.servings = t;
    d.title = `${t} の定食`;
  }else if(d.kind === 'kaiseki'){
    const m = thisMonthLabel();
    d.servings = m;
    d.title = `${m} の会席`;
  }else if(d.kind === 'order'){
    const t = todayLabel();
    d.servings = t;
    d.title = `${t} の発注`;
  }else if(d.kind === 'makanai'){
    const t = todayLabel();
    d.servings = t;
    d.title = `${t} の賄い`;
  }else if(d.kind === 'mistake'){
    d.servings = todayLabel();
  }else if(d.kind === 'obanzai'){
    const w = thisWeekLabel();
    d.servings = w;
    d.title = `${w}のおばんざい`;
  }

  state.draft = d;
  state.draftMode = 'add';
  setView('form');
}

async function commitFormAndSave(){
  const d = state.draft;
  const kindEl = document.getElementById('f-kind');
  if(kindEl) d.kind = kindEl.value;
  const scopeEl = document.getElementById('f-scope');
  if(scopeEl) d.scope = scopeEl.value;
  d.title = document.getElementById('f-title').value;
  d.reading = document.getElementById('f-reading').value;
  d.servings = document.getElementById('f-servings').value;
  d.tags = document.getElementById('f-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  d.notes = document.getElementById('f-notes').value;

  if(!d.title.trim()){
    state.banner = {type:'error', text:'タイトルを入力してください。'};
    render(); return;
  }
  d.ingredients = (d.ingredients||[]).filter(i=>i.name.trim()!=='' || i.amount.trim()!=='');
  d.steps = (d.steps||[]).filter(s=>s.trim()!=='');
  d.menu = autoLinkMenu(normalizeMenu(d.menu));
  if(!d.id){ d.id = uid(); d.createdAt = new Date().toISOString(); }

  try{
    const res = await saveRecipe(d);
    const queuedNote = (res && res.queued)
      ? '（オフラインのため、通信が戻ったときに同期されます）' : '';

    // Created from a menu item: attach it to that dish and return there.
    if(state.linkBack && state.linkBack.entryId){
      const { entryId, index } = state.linkBack;
      state.linkBack = null;
      const parent = state.recipes.find(x=>x.id===entryId);
      if(parent && Array.isArray(parent.menu) && parent.menu[index]){
        const updated = JSON.parse(JSON.stringify(parent));
        updated.menu[index].recipeId = d.id;
        try{
          await saveRecipe(updated);
          state.selectedId = entryId;
          state.banner = {type:'success', text:`「${d.title}」を保存し、献立に紐づけました。`};
          setView('detail');
          return;
        }catch(e){ /* fall through to the normal path */ }
      }
    }

    state.selectedId = d.id;
    state.banner = {type:'success', text:'保存しました。' + queuedNote};
    setView('detail');
  }catch(e){
    state.banner = {type:'error', text:'保存に失敗しました: ' + (e && e.message ? e.message : '不明なエラー')};
    render();
  }
}

// The text inputs are only read on save, so anything typed would be lost when
// the form re-renders (adding a photo, an ingredient row, a step...).
// Capture them into the draft first.
function syncFormFields(){
  if(!state.draft) return;
  const get = id => {
    const el = document.getElementById(id);
    return el ? el.value : null;
  };
  const kind = get('f-kind');         if(kind !== null) state.draft.kind = kind;
  const title = get('f-title');       if(title !== null) state.draft.title = title;
  const reading = get('f-reading');   if(reading !== null) state.draft.reading = reading;
  const servings = get('f-servings'); if(servings !== null) state.draft.servings = servings;
  const notes = get('f-notes');       if(notes !== null) state.draft.notes = notes;
  const tags = get('f-tags');
  if(tags !== null) state.draft.tags = tags.split(',').map(t=>t.trim()).filter(Boolean);
}

        </div>

          <input type="number" id="p-people" min="1" max="20" value="${esc(String(f.people))}">

          ${taskLibs.map((lib,li)=>`
            <div class="task-lib">

      `}

      <label>仕込みリスト（1行に1つ）</label>
      <textarea id="p-tasks" rows="10" placeholder="出汁を引く
刺身を引く（鯛・鮪）
筑前煮を炊く
だし巻きを焼く
米を炊く（3升）
胡麻豆腐を固める">${esc(f.tasks)}</textarea>
      <div class="tip">所要時間が分かるものは「筑前煮を炊く 40分」のように書くと精度が上がります。分からなければ書かなくて構いません。</div>

      <label>その他の条件（任意）</label>
      <input type="text" id="p-note" value="${esc(f.note)}" placeholder="例: 12時に団体20名あり / 揚げ場は1人">

      <div class="row" style="margin-top:18px">
        <button class="btn-primary" id="p-build" ${state.busy?'disabled':''}>
          ${state.busy?'<span class="spinner"></span>段取りを考えています…':'✨ 段取りを作る'}
        </button>
        <button class="btn-secondary" id="p-back">戻る</button>
      </div>
      <div id="p-status" style="font-size:12px; margin-top:10px"></div>
    </div>
  `;

  const read = ()=>{
    const v = id => (document.getElementById(id)||{}).value || '';
    state.prep = {
      start: v('p-start'),
      lunch: v('p-lunch'),
      dinner: v('p-dinner'),
      people: parseInt(v('p-people'),10) || 1,
      burners: v('p-burners'),
      tasks: v('p-tasks'),
      note: v('p-note')
    };
    try{ window.localStorage.setItem('prepInputs', JSON.stringify(state.prep)); }catch(e){}
    return state.prep;
  };

  ['p-start','p-lunch','p-dinner','p-people','p-burners','p-tasks','p-note'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.onchange = read;
  });

  const appendTasks = (entries)=>{
    const box = document.getElementById('p-tasks');
    if(!box) return;
    const existing = box.value.split('\n').map(s=>s.trim()).filter(Boolean);
    const seen = new Set(existing.map(s=>s.replace(/[\s　]/g,'')));
    let added = 0;
    entries.forEach(({name, dur})=>{
      const line = dur ? `${name} ${dur}` : name;
      if(seen.has(line.replace(/[\s　]/g,''))) return;
      // Skip if the same task is already listed with a different duration.
      if(existing.some(e=>e.startsWith(name))) return;
      existing.push(line);
      seen.add(line.replace(/[\s　]/g,''));
      added++;
    });
    box.value = existing.join('\n');
    read();
    if(!added){
      const st = document.getElementById('p-status');
      if(st){ st.textContent = 'すでに追加されています。'; st.style.color = 'var(--ink-soft)'; }
    }
  };

  slot.querySelectorAll('[data-task]').forEach(el=>{
    el.onclick = ()=>appendTasks([{ name: el.dataset.task, dur: el.dataset.dur }]);
  });
  slot.querySelectorAll('[data-addall]').forEach(el=>{
    el.onclick = ()=>{
      const lib = taskLibs[parseInt(el.dataset.addall,10)];
      if(!lib) return;
      appendTasks((lib.ingredients||[]).filter(i=>i.name).map(i=>({name:i.name, dur:i.amount||''})));
    };
  });

  document.getElementById('p-back').onclick = ()=>setView('list');
  document.getElementById('p-build').onclick = async ()=>{
    const input = read();
    const status = document.getElementById('p-status');
    if(!input.tasks.trim()){
      status.textContent = '仕込みリストを入力してください。';
      status.style.color = 'var(--clay)';
      return;
    }
    if(!input.lunch && !input.dinner){
      status.textContent = '昼か夜、どちらかの営業開始時刻を入れてください。';
      status.style.color = 'var(--clay)';
      return;
    }
    state.busy = true;
    state.banner = {type:'info', text:'放置できる作業と手が塞がる作業を見分けて、段取りを組んでいます…'};
    render();
    try{
      const draft = await buildPrepSchedule(input);
      state.draft = draft;
      state.draftMode = 'review';
      state.busy = false;
      state.banner = {type:'success', text:'段取りを作りました。内容を確認して保存してください。'};
      setView('form');
    }catch(e){
      state.busy = false;
      state.banner = {type:'error', text:'作成に失敗しました: ' + (e && e.message ? e.message : '不明なエラー')};
      render();
    }
  };
}

  }

  slot.innerHTML = `
    <div class="card">
      <h3>読み取れたレシピ（${list.length}件）</h3>
      <p class="tip">内容を確認して保存してください。「編集して保存」で1件ずつ直せます。まとめて保存することもできます。</p>
      <div class="row" style="margin-top:12px">
        <button class="btn-primary" id="save-all-btn" ${state.busy?'disabled':''}>

        </button>
        <button class="btn-secondary" id="discard-all-btn" ${state.busy?'disabled':''}>すべて破棄</button>
      </div>
      <div id="pending-status" style="font-size:12px; margin-top:10px"></div>
    </div>

    ${list.map((r,i)=>`
      <div class="card" style="margin-top:16px">
        <div class="row-between">
          <h3>${esc(r.title || '（無題）')}</h3>
          <span class="chip">${i+1}/${list.length}</span>
        </div>

      </div>

    <div class="row" style="margin-top:20px">
      <button class="btn-secondary" id="pending-back">一覧に戻る</button>
    </div>
  `;

  document.getElementById('save-all-btn').onclick = async ()=>{
    const status = document.getElementById('pending-status');
    state.busy = true; render();
    let saved = 0;
    const failed = [];
    for(const r of (state.pendingRecipes||[])){
      try{
        const rec = Object.assign({}, r, { id: uid(), createdAt: new Date().toISOString() });
        await saveRecipe(rec);
        saved++;
      }catch(e){ failed.push(r.title || '（無題）'); }
    }
    state.busy = false;
    state.pendingRecipes = [];
    state.banner = failed.length
      ? {type:'info', text:`${saved}件を保存しました。${failed.length}件は失敗しました（${failed.join('、')}）。`}
      : {type:'success', text:`${saved}件のレシピを保存しました。`};
    setView('list');
  };

  document.getElementById('discard-all-btn').onclick = ()=>{
    if(!confirm('読み取ったレシピをすべて破棄しますか？')) return;
    state.pendingRecipes = [];
    state.banner = {type:'info', text:'破棄しました。'};
    setView('list');

  slot.querySelectorAll('[data-editpending]').forEach(el=>{

      const r = state.pendingRecipes[i];
      state.pendingRecipes.splice(i,1);
      state.draft = r;
      state.draftMode = 'review';
      setView('form');
    };
  });

  slot.querySelectorAll('[data-droppending]').forEach(el=>{
    el.onclick = ()=>{
      const i = parseInt(el.dataset.droppending,10);
      state.pendingRecipes.splice(i,1);
      render();
    };
  });

  document.getElementById('pending-back').onclick = ()=>setView('list');
}

function actionLabel(a){
  return a==='create' ? '追加' : a==='delete' ? '削除' : '編集';
}

function fmtTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  const p = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

  }

// Export every recipe in the current notebook — photos included — as a single
// file. This is what lets a notebook be moved to a completely separate
// installation (different Firebase project, different hosting, different
// owner) without any shared infrastructure.
async function exportNotebookFile(){
  const nb = currentNotebook();
  if(!nb) throw new Error('レシピ帳が選択されていません。');

  const snap = await getDocs(query(collection(db,'recipes'), where('notebookId','==',nb.id)));
  const recipes = [];
  snap.forEach(d=>{
    const r = d.data();
    recipes.push({
      kind: r.kind || 'recipe',
      menu: normalizeMenu(r.menu),
      stock: normalizeStock(r.stock),
      scope: r.scope || '',
      title: r.title || '',
      reading: r.reading || '',
      servings: r.servings || '',
      tags: Array.isArray(r.tags) ? r.tags : [],
      ingredients: Array.isArray(r.ingredients) ? r.ingredients : [],
      steps: Array.isArray(r.steps) ? r.steps : [],
      notes: r.notes || '',
      en: normalizeEn(r.en),
      photos: Array.isArray(r.photos) ? r.photos : [],
      createdAt: r.createdAt || ''
    });
  });

  const payload = {
    format: 'recipe-notebook-export',
    version: 1,
    notebookName: nb.name || '',
    exportedAt: new Date().toISOString(),
    recipeCount: recipes.length,
    recipes
  };

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const safeName = (nb.name || 'recipes').replace(/[^\w\u3040-\u30ff\u4e00-\u9faf-]/g,'_');
  const a = document.createElement('a');
  a.href = url;
  a.download = `${safeName}_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  return recipes.length;
}

// Import a previously exported file into the CURRENT notebook.
async function importNotebookFile(file){
  const text = await new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(new Error('ファイルを読み込めませんでした'));
    r.readAsText(file);
  });

  let payload;
  try{ payload = JSON.parse(text); }
  catch(e){ throw new Error('ファイルの形式が正しくありません。'); }

  const list = Array.isArray(payload) ? payload
    : (Array.isArray(payload.recipes) ? payload.recipes : null);
  if(!list) throw new Error('レシピが含まれていないファイルです。');

  let saved = 0;
  const failed = [];
  for(const r of list){
    if(!r || !String(r.title||'').trim()) continue;
    try{
      await saveRecipe({
        id: uid(),
        kind: r.kind || 'recipe',
        menu: normalizeMenu(r.menu),
        stock: normalizeStock(r.stock),
        scope: r.scope || '',
        title: r.title || '',
        reading: r.reading || '',
        photos: Array.isArray(r.photos) ? r.photos.slice(0, MAX_PHOTOS) : [],
        servings: r.servings || '',
        tags: Array.isArray(r.tags) ? r.tags : [],
        ingredients: Array.isArray(r.ingredients) ? r.ingredients : [],
        steps: Array.isArray(r.steps) ? r.steps : [],
        notes: r.notes || '',
        en: normalizeEn(r.en),
        createdAt: r.createdAt || new Date().toISOString()
      });
      saved++;
    }catch(e){ failed.push(r.title); }
  }
  return { saved, failed };
}

  document.getElementById('create-nb-btn').onclick = async ()=>{

      try{
        await renameNotebook(nb.id, name);

      try{

        nbStatus('追加に失敗しました: ' + (e && e.message ? e.message : ''), false);

      try{ await grantAdmin(nb.id, email); nbStatus(`${email} を管理者にしました。`, true); }
      catch(e){ nbStatus('変更に失敗しました: ' + (e && e.message ? e.message : ''), false); }
    };
  });

  slot.querySelectorAll('[data-revoke]').forEach(el=>{
    el.onclick = async ()=>{
      const email = el.dataset.revoke;

  slot.querySelectorAll('[data-viewer]').forEach(el=>{
    el.onclick = async ()=>{

        ? `${email} を「閲覧のみ」にしますか？\nレシピの追加・編集・削除ができなくなります。`
        : `${email} に編集を許可しますか？`;

      try{

        nbStatus(makeViewer ? `${email} を閲覧のみにしました。` : `${email} に編集を許可しました。`, true);

          </div>

        document.getElementById('copy-new-invite').onclick = ()=>copyExport('new-invite-url','copy-invite-status');
        loadInviteList(nb.id);

        resultBox.innerHTML = `<div class="banner error">発行に失敗しました: ${esc(e && e.message ? e.message : '')}</div>`;
      }
      createInviteBtn.disabled = false;
    };

  if(document.getElementById('invite-list')){
    loadInviteList(nb.id);
  }

  const relinkBtn = document.getElementById('relink-btn');
  if(relinkBtn){
    relinkBtn.onclick = async ()=>{
      const status = document.getElementById('relink-status');
      status.style.color = 'var(--ink-soft)';
      status.textContent = '照合中…';
      relinkBtn.disabled = true;
      try{
        const { changed, links, failed } = await relinkAllMenus();
        status.style.color = failed ? 'var(--clay)' : 'var(--sage)';
        status.textContent = links
          ? `${changed}件の献立で ${links}品目を紐づけました。` + (failed ? ` （${failed}件は保存できませんでした）` : '')
          : '新しく紐づくものはありませんでした。';
        try{ render(); }catch(e){}
      }catch(e){
        status.style.color = 'var(--clay)';
        status.textContent = '紐づけに失敗しました: ' + (e && e.message ? e.message : '');
      }
      relinkBtn.disabled = false;
    };
  }

  const exportNbBtn = document.getElementById('export-nb-btn');
  if(exportNbBtn){
    exportNbBtn.onclick = async ()=>{
      const status = document.getElementById('export-nb-status');
      status.textContent = '書き出し中…';
      status.style.color = 'var(--ink-soft)';
      exportNbBtn.disabled = true;
      try{
        const n = await exportNotebookFile();
        status.textContent = `${n}件を書き出しました。`;
        status.style.color = 'var(--sage)';
      }catch(e){
        status.textContent = '書き出しに失敗しました: ' + (e && e.message ? e.message : '');
        status.style.color = 'var(--clay)';
      }
      exportNbBtn.disabled = false;
    };
  }

  const importNbBtn = document.getElementById('import-nb-btn');
  const importNbFile = document.getElementById('import-nb-file');
  if(importNbBtn && importNbFile){
    importNbBtn.onclick = ()=>importNbFile.click();

      const f = importNbFile.files && importNbFile.files[0];
      importNbFile.value = '';
      if(!f) return;
      const status = document.getElementById('import-nb-status');
      const target = currentNotebook();
      if(!confirm(`「${target ? target.name : ''}」にこのファイルのレシピを追加します。よろしいですか？`)) return;
      status.textContent = '取り込み中…';
      status.style.color = 'var(--ink-soft)';
      try{
        const { saved, failed } = await importNotebookFile(f);
        state.banner = failed.length
          ? {type:'info', text:`${saved}件を取り込みました。${failed.length}件は失敗しました。`}
          : {type:'success', text:`${saved}件のレシピを取り込みました。`};
        setView('list');
      }catch(e){
        status.textContent = '取り込みに失敗しました: ' + (e && e.message ? e.message : '');
        status.style.color = 'var(--clay)';
      }
    };
  }

  const delBtn = document.getElementById('delete-nb-btn');
  if(delBtn){
    delBtn.onclick = async ()=>{
      if(!confirm(`「${nb.name}」と、その中のレシピをすべて削除します。よろしいですか？`)) return;
      try{
        await deleteNotebook(nb.id);
        state.banner = {type:'info', text:'レシピ帳を削除しました。'};
        setView('list');
      }catch(e){
        state.banner = {type:'error', text:'削除に失敗しました: ' + (e && e.message ? e.message : '')};
        render();
      }
    };
  }

  document.getElementById('migrate-btn').onclick = async ()=>{
    const status = document.getElementById('migrate-status');
    if(!state.currentNotebookId){ status.textContent = 'レシピ帳を選んでください。'; return; }
    status.textContent = '確認中…';
    status.style.color = 'var(--ink-soft)';
    try{
      const moved = await migrateOrphanRecipes(state.currentNotebookId);
      if(moved){
        state.banner = {type:'success', text:`${moved}件のレシピを取り込みました。`};
        setView('list');
      }else{
        status.textContent = '取り込めるレシピはありませんでした。';
        status.style.color = 'var(--ink-soft)';
      }
    }catch(e){
      status.textContent = '取り込みに失敗しました: ' + (e && e.message ? e.message : '');
      status.style.color = 'var(--clay)';
    }
  };

  document.getElementById('nb-back').onclick = ()=>setView('list');
}

async function syncNow(){
  const btn = document.getElementById('sync-btn');
  if(btn){ btn.disabled = true; btn.textContent = '🔄 同期中…'; }
  try{
    subscribeNotebooks();
    state.banner = {type:'success', text:'最新の状態に更新しました。'};
  }catch(e){
    state.banner = {type:'error', text:'同期に失敗しました: ' + (e && e.message ? e.message : '不明なエラー')};
  }
  render();
}

      ${key ? `<div class="banner success" style="margin-top:12px">登録済み: <span class="mono">${esc(masked)}</span></div>` : `<div class="banner info" style="margin-top:12px">まだ登録されていません。</div>`}

    <div class="card" style="margin-top:20px">

  const showOffline = async ()=>{

        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister()));
        await navigator.serviceWorker.register('sw.js');
        try{ await navigator.serviceWorker.ready; }catch(e){}
      }
      await warmOfflineCache();
      try{
        if(navigator.serviceWorker && navigator.serviceWorker.controller){
          navigator.serviceWorker.controller.postMessage({ type:'warm-cache', force:true });
        }
      }catch(e){}
      setTimeout(showOffline, 2500);
    }catch(e){
      if(box){ box.textContent = '保存し直せませんでした: ' + (e && e.message ? e.message : ''); box.className = 'banner error'; }
    }
  };

  document.getElementById('save-groq-btn').onclick = ()=>{
    const val = (document.getElementById('groq-key-input').value||'').trim();
    const status = document.getElementById('groq-status');
    if(!val){
      status.textContent = 'キーを入力してください。';
      status.style.color = 'var(--clay)';
      return;
    }
    if(!val.startsWith('gsk_')){
      status.textContent = 'キーの形式が違うようです（gsk_ で始まります）。';
      status.style.color = 'var(--clay)';
      return;
    }
    if(setGroqKey(val)){
      state.banner = {type:'success', text:'キーを保存しました。写真の読み取り後、自動整理が使えます。'};
      render();
    }else{
      status.textContent = '保存に失敗しました。';
      status.style.color = 'var(--clay)';
    }
  };

  const clearGroqBtn = document.getElementById('clear-groq-btn');
  if(clearGroqBtn){
    clearGroqBtn.onclick = ()=>{
      if(!confirm('キーを削除しますか？')) return;
      setGroqKey('');
      state.banner = {type:'info', text:'キーを削除しました。'};
      render();
    };
  }

  document.getElementById('save-key-btn').onclick = ()=>{
    const val = (document.getElementById('api-key-input').value||'').trim();
    const status = document.getElementById('key-status');
    if(!val){
      status.textContent = 'キーを入力してください。';
      status.style.color = 'var(--clay)';
      return;
    }
    if(!val.startsWith('sk-ant-')){
      status.textContent = 'キーの形式が違うようです（sk-ant- で始まります）。';
      status.style.color = 'var(--clay)';
      return;
    }
    if(setApiKey(val)){
      state.banner = {type:'success', text:'APIキーを保存しました。写真・テキストからの読み取りが使えます。'};
      render();
    }else{
      status.textContent = '保存に失敗しました。';
      status.style.color = 'var(--clay)';
    }
  };

  const clearBtn = document.getElementById('clear-key-btn');
  if(clearBtn){
    clearBtn.onclick = ()=>{
      if(!confirm('APIキーを削除しますか？')) return;
      setApiKey('');
      state.banner = {type:'info', text:'APIキーを削除しました。'};
      render();
    };
  }

  document.getElementById('settings-back').onclick = ()=>setView('list');
}

// Building the results separately means the search box element itself is never
// destroyed while the user is typing. Recreating it mid-input breaks Japanese
// IME composition (characters get dropped or duplicated).
function buildListBody(filtered, picking, chosen){
  const secName = (state.section !== 'all' && KINDS[state.section])
    ? KINDS[state.section].label : '';
  if(!filtered.length && !state.search.trim()){
    if(state.section === 'mistake'){
      return `<div class="empty">
        <h3>ミスと対策はまだありません</h3>
        <p>タイトルに「何が起きたか」、原因欄に「なぜ起きたか」、<br>
        対策欄に「次にどうするか」を書き残しておくと、同じことを繰り返しにくくなります。</p>
      </div>`;
    }
    return `<div class="empty">
      <h3>${secName ? esc(secName) + 'はまだありません' : 'まだ何もありません'}</h3>
      <p>「手動で追加」から入力するか、「写真から読み込む」で撮影して取り込めます。</p>
    </div>`;
  }
  if(!filtered.length){
    return `<div class="empty"><p>「${esc(state.search)}」に一致するものが見つかりませんでした。</p></div>`;
  }
  return `<div class="grid">` + filtered.map(r=>{
    const sel = chosen.includes(r.id);
    return `
      <div class="card recipe-card ${picking && sel ? 'picked':''}" data-open="${esc(r.id)}">
        <div class="tab-ribbon"></div>
        ${picking ? `<div class="pick-mark">${sel?'✓':''}</div>` : ''}
        ${(r.photos||[]).length ? `<img src="${r.photos[0]}" alt="" class="card-photo">` : ''}
        <h3>${esc(r.title)}</h3>
        <div class="meta">
          ${state.section==='all' && kindOf(r)!=='recipe' ? `<span class="kind-chip">${esc(kindConf(r).chip)}</span>` : ''}
          ${r.servings?esc(r.servings):''}
        </div>
        ${kindConf(r).usesMenu && (r.menu||[]).length ? `<div class="meta">${(r.menu||[]).length}品</div>` : ''}
        ${kindConf(r).usesStock ? `<div class="meta">
          <span class="chip">${esc(scopeLabel(r.scope||'all'))}</span>
          ${normalizeStock(r.stock).length}品目
          ${lowStockCount(r) ? `<span class="sec-alert">発注 ${lowStockCount(r)}</span>` : ''}
        </div>` : ''}
        <div class="tags">${(r.tags||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>
      </div>`;
  }).join('') + `</div>`;
}

/* ---------------- Calendar ---------------- */

// Dated sections get a calendar; monthly ones get a month picker.
const CAL_KINDS = { lunch:'day', makanai:'day', order:'day', obanzai:'week' };
const MONTH_KINDS = { kaiseki:true };

function calModeFor(section){
  if(CAL_KINDS[section]) return 'calendar';
  if(MONTH_KINDS[section]) return 'months';
  return null;
}

// The date lives in the free-text "提供日 / 提供期間" field, so parsing is
// deliberately lenient: 2026/09/07（月）, 2026年9月7日 and 2026年 9/7〜9/11 all work.
function entryDate(r){
  const s = String((r && r.servings) || '');
  const m = s.match(/(\d{4})\s*[\/年.-]\s*(\d{1,2})\s*[\/月.-]\s*(\d{1,2})/);
  if(m){
    const d = new Date(+m[1], +m[2]-1, +m[3]);
    if(!isNaN(d)) return d;
  }
  if(r && r.createdAt){
    const d = new Date(r.createdAt);
    if(!isNaN(d)) return d;
  }
  return null;
}

function entryMonth(r){
  const s = String((r && r.servings) || '');
  const m = s.match(/(\d{4})\s*年\s*(\d{1,2})\s*月/);
  if(m) return { y:+m[1], m:+m[2] };
  const d = entryDate(r);
  return d ? { y:d.getFullYear(), m:d.getMonth()+1 } : null;
}

const sameDay = (a,b)=> a && b &&
  a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();

// Weekly entries cover the five days from their start date.
function entriesOnDay(list, day){
  return list.filter(r=>{
    const d = entryDate(r);
    if(!d) return false;
    if(CAL_KINDS[kindOf(r)] === 'week'){
      const end = new Date(d); end.setDate(d.getDate() + 6);
      return day >= new Date(d.getFullYear(),d.getMonth(),d.getDate()) && day <= end;
    }
    return sameDay(d, day);
  });
}

function shiftCalMonth(delta){
  const c = state.calMonth;
  const d = new Date(c.y, c.m - 1 + delta, 1);
  state.calMonth = { y:d.getFullYear(), m:d.getMonth()+1 };
  render();
}

function buildCalendar(list){
  const { y, m } = state.calMonth;
  const first = new Date(y, m-1, 1);
  const daysInMonth = new Date(y, m, 0).getDate();
  const lead = first.getDay();
  const today = new Date();

  const cells = [];
  for(let i=0; i<lead; i++) cells.push('<div class="cal-cell empty"></div>');
  for(let d=1; d<=daysInMonth; d++){
    const day = new Date(y, m-1, d);
    const hits = entriesOnDay(list, day);
    const isToday = sameDay(day, today);
    const cls = ['cal-cell'];
    if(hits.length) cls.push('has');
    if(isToday) cls.push('today');
    cells.push(`
      <div class="${cls.join(' ')}" ${hits.length?`data-calopen="${esc(hits[0].id)}"`:''}>
        <span class="cal-num">${d}</span>
        ${hits.length ? `<span class="cal-dot"></span>` : ''}
      </div>`);
  }

  return `
    <div class="cal-head">
      <button class="mini-btn" data-calshift="-1">‹ 前月</button>
      <strong>${y}年${m}月</strong>
      <button class="mini-btn" data-calshift="1">翌月 ›</button>
    </div>
    <div class="cal-grid">
      ${['日','月','火','水','木','金','土'].map((w,i)=>`<div class="cal-wd ${i===0?'sun':''}${i===6?'sat':''}">${w}</div>`).join('')}
      ${cells.join('')}
    </div>
    <div class="tip">印のある日をタップすると、その日の記録が開きます。</div>
  `;
}

function buildMonthList(list){
  const groups = new Map();
  list.forEach(r=>{
    const mm = entryMonth(r);
    if(!mm) return;
    const key = `${mm.y}-${String(mm.m).padStart(2,'0')}`;
    if(!groups.has(key)) groups.set(key, { y:mm.y, m:mm.m, items:[] });
    groups.get(key).items.push(r);
  });
  const keys = Array.from(groups.keys()).sort().reverse();
  if(!keys.length) return `<div class="empty"><p>まだ登録がありません。</p></div>`;

  return `
    <div class="month-list">
      ${keys.map(k=>{
        const g = groups.get(k);
        return `
          <div class="month-group">
            <div class="month-title">${g.y}年${g.m}月</div>
            ${g.items.map(r=>`
              <button class="month-item" data-calopen="${esc(r.id)}">
                <span>${esc(r.title)}</span>
                <span class="month-count">${(r.menu||[]).length}品</span>
              </button>
            `).join('')}
          </div>`;
      }).join('')}
    </div>
  `;
}

function filterRecipes(){
  const q = state.search.trim().toLowerCase();
  const out = state.recipes.filter(r=>{
    if(state.section !== 'all' && kindOf(r) !== state.section) return false;
    if(!q) return true;
    return ((r.title||'') + ' ' + (r.reading||'') + ' ' + (r.servings||'') + ' ' + (r.tags||[]).join(' ')).toLowerCase().includes(q);
  });
  sortRecipes(out);
  return out;
}

// Update only the results area, leaving the search box untouched.
function refreshListResults(){
  const holder = document.getElementById('list-body');
  if(!holder) return;
  const picking = state.selectMode;
  const chosen = state.selected || [];
  holder.innerHTML = buildListBody(filterRecipes(), picking, chosen);
  bindRecipeCards(holder);
}

function bindRecipeCards(root){
  root.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.open;
      if(state.selectMode){
        const i = state.selected.indexOf(id);
        if(i>-1) state.selected.splice(i,1); else state.selected.push(id);
        renderList();
      }else{
        openDetail(id);
      }
    };
  });
}

function renderList(){
  const slot = document.getElementById('view-slot');
  const filtered = filterRecipes();
  const picking = state.selectMode;
  const chosen = state.selected || [];
  const otherNotebooks = state.notebooks.filter(n=>n.id!==state.currentNotebookId);

  const body = buildListBody(filtered, picking, chosen);

  const copyBar = picking ? `
    <div class="copy-bar">
      <div class="row" style="justify-content:space-between; width:100%">
        <strong style="font-size:13px">${chosen.length}件を選択中</strong>
        <div class="row" style="gap:6px">
          <button class="mini-btn" id="select-all">すべて選択</button>
          <button class="mini-btn" id="select-none">選択を解除</button>
        </div>
      </div>
      ${otherNotebooks.length ? `
        <div class="row" style="width:100%; margin-top:10px">
          <select id="copy-target" style="flex:1">
            ${otherNotebooks.map(n=>`<option value="${esc(n.id)}">${esc(n.name)}</option>`).join('')}
          </select>
          <button class="btn-primary" id="copy-go" ${chosen.length?'':'disabled'}>コピーする</button>
        </div>
      ` : `<div class="tip" style="width:100%">コピー先のレシピ帳がありません。「管理」から新しいレシピ帳を作ってください。</div>`}
      ${canEdit() ? `
        <div class="row" style="width:100%; margin-top:10px">
          <button class="btn-danger" id="bulk-delete" ${chosen.length?'':'disabled'}>選択した${chosen.length}件を削除</button>
        </div>
      ` : ''}
      <div id="copy-status" style="font-size:12px; width:100%; margin-top:8px"></div>
      <button class="mini-btn" id="exit-pick" style="margin-top:8px">選択モードをやめる</button>
    </div>
  ` : '';

  const invBar = (state.section === 'inventory' && canEdit()) ? `
    <div class="plan-bar">
      <div>
        <strong style="font-size:14px">献立別の在庫表を作る</strong>
        <div class="tip" style="margin-top:2px">昼の定食・昼の会席・おばんざい・夜の会席ごとに、献立から食材を集めて在庫表を作ります</div>
      </div>
      <button class="btn-primary" id="make-scoped-inv">まとめて作成</button>
    </div>
  ` : '';

  const planBar = (state.section === 'schedule' && canEdit()) ? `
    <div class="plan-bar">
      <div>
        <strong style="font-size:14px">段取りをAIに組んでもらう</strong>
        <div class="tip" style="margin-top:2px">仕込みリストと営業時刻から、並行作業の時間割を作ります</div>
      </div>
      <button class="btn-primary" id="open-planner">段取りを作る</button>
    </div>
  ` : '';

  const calMode = calModeFor(state.section);
  const showingCal = calMode && state.listMode === 'calendar';

  const viewToggle = calMode ? `
    <div class="view-toggle">
      <button class="${!showingCal?'active':''}" data-listmode="list">一覧</button>
      <button class="${showingCal?'active':''}" data-listmode="calendar">${calMode==='months'?'月別':'カレンダー'}</button>
    </div>
  ` : '';

  if(showingCal){
    slot.innerHTML = `
      ${planBar}
      ${viewToggle}
      <div class="card ${calMode === 'months' ? '' : 'cal-card'}">
        ${calMode === 'months' ? buildMonthList(state.recipes.filter(r=>kindOf(r)===state.section))
                               : buildCalendar(state.recipes.filter(r=>kindOf(r)===state.section))}
      </div>
    `;
    slot.querySelectorAll('[data-listmode]').forEach(b=>{
      b.onclick = ()=>{ state.listMode = b.dataset.listmode; persistListMode(); render(); };
    });
    slot.querySelectorAll('[data-calshift]').forEach(b=>{
      b.onclick = ()=>shiftCalMonth(parseInt(b.dataset.calshift,10));
    });
    slot.querySelectorAll('[data-calopen]').forEach(b=>{
      b.onclick = ()=>openDetail(b.dataset.calopen);
    });
    return;
  }

  slot.innerHTML = `
    ${planBar}
    ${invBar}
    ${viewToggle}
    <div class="searchbar">
      <input type="text" id="search-input" placeholder="名前・タグで検索" value="${esc(state.search)}">
      <select id="sort-select" style="max-width:120px">
        <option value="new" ${state.sort==='new'?'selected':''}>追加順</option>
        <option value="kana" ${state.sort==='kana'?'selected':''}>五十音順</option>
      </select>
      ${state.recipes.length && !picking ? `<button class="btn-secondary" id="enter-pick" style="white-space:nowrap">選択</button>` : ''}
    </div>
    ${copyBar}
    <div id="list-body">${body}</div>
  `;

  const si = document.getElementById('search-input');
  // While an IME conversion is in progress the value is provisional, so hold
  // off updating until the user commits it. Only the results are redrawn, so
  // the input keeps its focus, caret position and composition state.
  let composing = false;
  si.addEventListener('compositionstart', ()=>{ composing = true; });
  si.addEventListener('compositionend', ()=>{
    composing = false;
    state.search = si.value;
    refreshListResults();
  });
  si.addEventListener('input', ()=>{
    if(composing) return;
    state.search = si.value;
    refreshListResults();
  });

  slot.querySelectorAll('[data-listmode]').forEach(b=>{
    b.onclick = ()=>{ state.listMode = b.dataset.listmode; persistListMode(); render(); };
  });

  const makeInv = document.getElementById('make-scoped-inv');
  if(makeInv) makeInv.onclick = async ()=>{
    makeInv.disabled = true;
    await createScopedInventories();
  };

  const openPlanner = document.getElementById('open-planner');
  if(openPlanner) openPlanner.onclick = ()=>setView('prep');

  const sortSel = document.getElementById('sort-select');
  if(sortSel) sortSel.onchange = ()=>setSort(sortSel.value);


  bindRecipeCards(slot);

  const enterPick = document.getElementById('enter-pick');
  if(enterPick) enterPick.onclick = ()=>{ state.selectMode = true; state.selected = []; renderList(); };

  const exitPick = document.getElementById('exit-pick');
  if(exitPick) exitPick.onclick = ()=>{ state.selectMode = false; state.selected = []; renderList(); };

  const selAll = document.getElementById('select-all');
  if(selAll) selAll.onclick = ()=>{ state.selected = filtered.map(r=>r.id); renderList(); };

  const selNone = document.getElementById('select-none');
  if(selNone) selNone.onclick = ()=>{ state.selected = []; renderList(); };

  const bulkDel = document.getElementById('bulk-delete');
  if(bulkDel){
    bulkDel.onclick = async ()=>{
      const names = chosen
        .map(id=>(state.recipes.find(r=>r.id===id)||{}).title)
        .filter(Boolean);
      const preview = names.slice(0,5).join('、') + (names.length>5 ? ` ほか${names.length-5}件` : '');
      if(!confirm(`${chosen.length}件のレシピを削除します。\n\n${preview}\n\nよろしいですか？\n（履歴から元に戻すことができます）`)) return;

      const status = document.getElementById('copy-status');
      bulkDel.disabled = true;
      status.textContent = '削除中…';
      status.style.color = 'var(--ink-soft)';

      let done = 0;
      const failed = [];
      for(const id of chosen){
        try{ await removeRecipe(id); done++; }
        catch(e){ failed.push((state.recipes.find(r=>r.id===id)||{}).title || id); }
      }

      state.selectMode = false;
      state.selected = [];
      state.banner = failed.length
        ? {type:'info', text:`${done}件を削除しました。${failed.length}件は失敗しました。`}
        : {type:'success', text:`${done}件を削除しました。取り消したい場合は「履歴」から元に戻せます。`};
      render();
    };
  }

  const copyGo = document.getElementById('copy-go');
  if(copyGo){
    copyGo.onclick = async ()=>{
      const targetId = document.getElementById('copy-target').value;
      const target = state.notebooks.find(n=>n.id===targetId);
      const status = document.getElementById('copy-status');
      if(!target){ return; }
      if(!confirm(`${chosen.length}件を「${target.name}」にコピーしますか？\n元のレシピはそのまま残ります。`)) return;

      copyGo.disabled = true;
      status.textContent = 'コピー中…';
      status.style.color = 'var(--ink-soft)';
      try{
        const n = await copyRecipesTo(chosen, targetId);
        state.selectMode = false;
        state.selected = [];
        state.banner = {type:'success', text:`${n}件を「${target.name}」にコピーしました。`};
        render();
      }catch(e){
        status.textContent = 'コピーに失敗しました: ' + (e && e.message ? e.message : '');
        status.style.color = 'var(--clay)';
        copyGo.disabled = false;
      }
    };
  }
}

// Copy recipes into another notebook the user belongs to. Originals are kept,
// and each copy gets a fresh id so the two notebooks stay independent.
async function copyRecipesTo(ids, targetNotebookId){
  const target = state.notebooks.find(n=>n.id===targetNotebookId);
  if(!target) throw new Error('コピー先のレシピ帳が見つかりません。');
  const me = normEmail(state.user && state.user.email);
  const targetAdmins = adminsOf(target);
  const targetViewers = Array.isArray(target.viewers) ? target.viewers.map(normEmail) : [];
  if(!targetAdmins.includes(me) && targetViewers.includes(me)){
    throw new Error(`「${target.name}」では閲覧のみ許可されているため、コピーできません。`);
  }

  let n = 0;
  for(const id of ids){
    const r = state.recipes.find(x=>x.id===id);
    if(!r) continue;
    const newId = uid();
    await setDoc(doc(db, 'recipes', newId), {
      notebookId: targetNotebookId,
      kind: r.kind || 'recipe',
      menu: normalizeMenu(r.menu),
      stock: normalizeStock(r.stock),
      scope: r.scope || '',
      title: r.title || '',
      reading: r.reading || '',
      photos: r.photos || [],
      servings: r.servings || '',
      tags: r.tags || [],
      ingredients: r.ingredients || [],
      steps: r.steps || [],
      notes: r.notes || '',
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      updatedBy: state.user ? state.user.email : ''
    });
    n++;
  }
  return n;
}

// Photos are stored small to fit the storage budget, so being able to fill
// the screen with one is what makes them actually usable in the kitchen.
function openPhotoViewer(photos, index){
  if(!photos || !photos.length) return;
  let i = Math.max(0, Math.min(index, photos.length - 1));

  const overlay = document.createElement('div');
  overlay.className = 'photo-viewer';
  const paint = ()=>{
    overlay.innerHTML = `
      <button class="pv-close" aria-label="閉じる">✕</button>
      <img src="${photos[i]}" alt="">
      ${photos.length > 1 ? `
        <button class="pv-nav pv-prev" ${i===0?'disabled':''}>‹</button>
        <button class="pv-nav pv-next" ${i===photos.length-1?'disabled':''}>›</button>
        <div class="pv-count">${i+1} / ${photos.length}</div>
      ` : ''}
    `;
    overlay.querySelector('.pv-close').onclick = close;
    const prev = overlay.querySelector('.pv-prev');
    const next = overlay.querySelector('.pv-next');
    if(prev) prev.onclick = (e)=>{ e.stopPropagation(); if(i>0){ i--; paint(); } };
    if(next) next.onclick = (e)=>{ e.stopPropagation(); if(i<photos.length-1){ i++; paint(); } };
  };
  const close = ()=>{
    document.removeEventListener('keydown', onKey);
    overlay.remove();
  };
  const onKey = (e)=>{
    if(e.key === 'Escape') close();
    else if(e.key === 'ArrowLeft' && i>0){ i--; paint(); }
    else if(e.key === 'ArrowRight' && i<photos.length-1){ i++; paint(); }
  };
  overlay.onclick = (e)=>{ if(e.target === overlay) close(); };
  document.addEventListener('keydown', onKey);
  paint();
  document.body.appendChild(overlay);
}

function renderDetail(){
  const slot = document.getElementById('view-slot');
  const r = state.recipes.find(x=>x.id===state.selectedId);
  if(!r){ slot.innerHTML = `<div class="empty">項目が見つかりません。</div>`; return; }
  const editable = canEdit();
  const DK = kindConf(r);
  const checks = DK.checkable ? getChecks(r.id) : [];
  // Set when arriving here by tapping a dish on a menu, so we can offer a
  // way back to that menu instead of dumping the person in the list.
  const backTo = (state.menuReturnId && state.menuReturnId !== r.id)
    ? state.recipes.find(x=>x.id===state.menuReturnId) : null;
  slot.innerHTML = `
    <div class="card detail">
      <div class="row-between">
        <h2>${esc(r.title)}</h2>
        ${editable ? `
        <div class="row">
          <button class="btn-secondary" id="edit-btn">編集</button>
          <button class="btn-danger" id="del-btn">削除</button>
        </div>` : ''}
      </div>
      <div class="meta-row">${r.servings?esc(r.servings):''}${r.updatedBy?`<br><span style="font-size:11px">最終更新: ${esc(r.updatedBy)} ・ ${esc(fmtTime(r.updatedAt))}</span>`:''}</div>
      <div class="tags">${(r.tags||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>

      <div class="row" style="margin-top:10px">
        <button class="${state.enOpen===r.id?'btn-primary':'btn-secondary'}" id="en-toggle">
          ${state.enOpen===r.id ? '英語の説明を閉じる' : (r.en ? '英語の説明を見せる' : '英語の説明')}
        </button>
      </div>
      ${renderEnPanel(r)}

      ${(r.photos||[]).length ? `
        <div class="photo-view">
          ${r.photos.map((p,i)=>`<img src="${p}" alt="" class="photo-full" data-zoom="${i}">`).join('')}
        </div>
        <div class="tip">写真をタップすると大きく表示できます。</div>
      ` : ''}

      ${DK.usesStock ? renderStockPanel(r, editable, DK) : ''}

      ${DK.usesMenu ? `
        <div class="section-label">${esc(DK.menuLabel)}</div>
        <ul class="menu-view">
          ${(r.menu||[]).map((m,i)=>{
            const target = m.recipeId ? menuLinkTarget(m.recipeId) : null;
            return `
              <li class="${target?'linked':''}" ${target?`data-openrecipe="${esc(m.recipeId)}"`:''}>
                <span class="menu-order">${i+1}</span>
                <span class="menu-name">${esc(m.name)}</span>
                ${target
                  ? `<span class="menu-go">レシピ ›</span>`
                  : (m.recipeId
                      ? `<span class="menu-missing">レシピが見つかりません</span>`
                      : (editable ? `<button class="menu-make" data-makerecipe="${i}">＋ レシピ</button>` : ''))}
              </li>`;
          }).join('') || `<li>品目の登録はありません</li>`}
        </ul>
      ` : `
      <div class="section-label">${esc(DK.pairsLabel)}</div>
      <ul class="ing-list">
        ${(r.ingredients||[]).filter(i=>i.name||i.amount).map(i=>`<li><span>${esc(i.name)}</span><span class="amt">${esc(i.amount||'')}</span></li>`).join('') || `<li>記載はありません</li>`}
      </ul>

      <div class="section-label">${esc(DK.stepsLabel)}</div>
      ${DK.checkable ? `
        <ul class="check-list">
          ${(r.steps||[]).filter(Boolean).map((s,idx)=>`
            <li class="${checks.includes(idx)?'done':''}" data-check="${idx}">
              <span class="check-box">${checks.includes(idx)?'✓':''}</span>
              <span class="check-text">${esc(s)}</span>
            </li>
          `).join('') || `<li>記載はありません</li>`}
        </ul>
        ${(r.steps||[]).filter(Boolean).length ? `
          <div class="row" style="margin-top:10px; align-items:center">
            <button class="mini-btn" id="reset-checks">チェックを消す</button>
            <span class="tip" style="margin:0">${checks.length}/${(r.steps||[]).filter(Boolean).length} 完了 ・ 日付が変わると自動で戻ります</span>
          </div>
        ` : ''}
      ` : `
        <ul class="steps-list">
          ${(r.steps||[]).filter(Boolean).map(s=>`<li>${esc(s)}</li>`).join('') || `<li>記載はありません</li>`}
        </ul>
      `}

      `}

      ${r.notes ? `<div class="notes-box">${esc(r.notes)}</div>` : ''}
    </div>
    <div class="row" style="margin-top:16px">
      ${backTo ? `<button class="btn-secondary" id="back-menu-btn">‹ ${esc(backTo.title)} に戻る</button>` : ''}
      ${DK.usesTasks && canEdit() ? `<button class="btn-primary" id="to-planner-btn">この項目で段取りを組む</button>` : ''}
      ${canEdit() ? `<button class="btn-secondary" id="dup-btn">複製して新規作成</button>` : ''}
      <button class="btn-secondary" id="back-btn">一覧に戻る</button>
      ${state.notebooks.length > 1 ? `<button class="btn-secondary" id="copy-one-btn">別のレシピ帳にコピー</button>` : ''}
    </div>
    <div id="menu-make-panel"></div>
    <div id="copy-one-panel"></div>
  `;
  wireStockPanel(slot, r);

  const enToggle = document.getElementById('en-toggle');
  if(enToggle) enToggle.onclick = ()=>{
    state.enOpen = (state.enOpen === r.id) ? null : r.id;
    render();
  };
  wireEnPanel(slot, r);

  slot.querySelectorAll('[data-zoom]').forEach(el=>{
    el.onclick = ()=>openPhotoViewer(r.photos || [], parseInt(el.dataset.zoom,10));
  });

  slot.querySelectorAll('[data-makerecipe]').forEach(el=>{
    el.onclick = (ev)=>{
      ev.stopPropagation();
      const i = parseInt(el.dataset.makerecipe,10);
      const line = (r.menu||[])[i];
      if(!line) return;
      const dishes = splitDishes(line.name);

      const start = (dishName)=>{
        const draft = emptyDraft();
        draft.kind = 'recipe';
        draft.title = dishName;
        // Remember where to link the finished recipe back to.
        state.linkBack = { entryId: r.id, index: i };
        state.draft = draft;
        state.draftMode = 'add';
        setView('form');
      };

      if(dishes.length <= 1){
        start(dishes[0] || line.name);
        return;
      }

      // Several dishes on one line: let the person pick which to write up.
      const panel = document.getElementById('menu-make-panel');
      if(!panel) return;
      panel.innerHTML = `
        <div class="card" style="margin-top:14px">
          <label style="margin-top:0">どれのレシピを作りますか？</label>
          <div class="row" style="flex-wrap:wrap; gap:6px">
            ${dishes.map((d,di)=>`<button class="task-chip" data-dish="${di}">${esc(d)}</button>`).join('')}
          </div>
          <div class="tip">選んだものが、この品目に紐づきます。</div>
        </div>
      `;
      panel.querySelectorAll('[data-dish]').forEach(b=>{
        b.onclick = ()=>start(dishes[parseInt(b.dataset.dish,10)]);
      });
      panel.scrollIntoView({behavior:'smooth', block:'nearest'});
    };
  });

  slot.querySelectorAll('[data-openrecipe]').forEach(el=>{
    el.onclick = ()=>{
      state.menuReturnId = r.id;
      openDetail(el.dataset.openrecipe);
    };
  });

  slot.querySelectorAll('[data-check]').forEach(el=>{
    el.onclick = ()=>{
      const idx = parseInt(el.dataset.check,10);
      const cur = getChecks(r.id);
      const at = cur.indexOf(idx);
      if(at > -1) cur.splice(at,1); else cur.push(idx);
      setChecks(r.id, cur);
      renderDetail();
    };
  });
  const resetChecks = document.getElementById('reset-checks');
  if(resetChecks) resetChecks.onclick = ()=>{ setChecks(r.id, []); renderDetail(); };

  const editBtn = document.getElementById('edit-btn');
  if(editBtn) editBtn.onclick = ()=>openEdit(r.id);
  const delBtn2 = document.getElementById('del-btn');
  if(delBtn2) delBtn2.onclick = ()=>deleteRecipeUI(r.id);
  // Daily and weekly records repeat with small changes, so starting from a
  // copy is far quicker than retyping the whole structure.
  const dupBtn = document.getElementById('dup-btn');
  if(dupBtn) dupBtn.onclick = ()=>{
    const copy = JSON.parse(JSON.stringify(r));
    copy.id = null;
    copy.createdAt = null;
    const k = kindOf(copy);
    if(k === 'lunch'){
      const t = todayLabel();
      copy.servings = t;
      copy.title = `${t} の定食`;
    }else if(k === 'makanai'){
      const t = todayLabel();
      copy.servings = t;
      copy.title = `${t} の賄い`;
    }else if(k === 'order'){
      const t = todayLabel();
      // Keep the supplier, move the date.
      const supplier = String(copy.servings||'').replace(/^\S+\s*/, '').trim();
      copy.servings = supplier ? `${t}　${supplier}` : t;
      copy.title = `${t} の発注${supplier ? '（' + supplier + '）' : ''}`;
    }else if(k === 'obanzai'){
      const w = thisWeekLabel();
      copy.servings = w;
      copy.title = `${w}のおばんざい`;
    }else if(k === 'kaiseki'){
      const m = thisMonthLabel();
      copy.servings = m;
      copy.title = `${m} の会席`;
    }else{
      copy.title = `${copy.title}（コピー）`;
    }
    state.draft = copy;
    state.draftMode = 'add';
    state.banner = {type:'info', text:'複製しました。内容を直して保存してください。'};
    setView('form');
  };

  const toPlanner = document.getElementById('to-planner-btn');
  if(toPlanner) toPlanner.onclick = ()=>{
    const lines = (r.ingredients||[])
      .filter(i=>i.name)
      .map(i=>i.amount ? `${i.name} ${i.amount}` : i.name);
    state.prep = Object.assign({}, state.prep, { tasks: lines.join('\n') });
    try{ window.localStorage.setItem('prepInputs', JSON.stringify(state.prep)); }catch(e){}
    setView('prep');
  };

  const backMenuBtn = document.getElementById('back-menu-btn');
  if(backMenuBtn) backMenuBtn.onclick = ()=>{
    const target = state.menuReturnId;
    state.menuReturnId = null;
    openDetail(target);
  };
  document.getElementById('back-btn').onclick = ()=>{ state.menuReturnId = null; setView('list'); };

  const copyOneBtn = document.getElementById('copy-one-btn');
  if(copyOneBtn){
    copyOneBtn.onclick = ()=>{
      const others = state.notebooks.filter(n=>n.id!==state.currentNotebookId);
      const panel = document.getElementById('copy-one-panel');
      panel.innerHTML = `
        <div class="card" style="margin-top:14px">
          <label>コピー先のレシピ帳</label>
          <div class="row">
            <select id="copy-one-target" style="flex:1">
              ${others.map(n=>`<option value="${esc(n.id)}">${esc(n.name)}</option>`).join('')}
            </select>
            <button class="btn-primary" id="copy-one-go">コピー</button>
          </div>
          <div id="copy-one-status" style="font-size:12px; margin-top:10px"></div>
          <div class="tip">このレシピの内容がコピーされます。元のレシピはそのまま残り、コピー先で編集しても元には影響しません。</div>
        </div>
      `;
      document.getElementById('copy-one-go').onclick = async ()=>{
        const targetId = document.getElementById('copy-one-target').value;
        const target = state.notebooks.find(n=>n.id===targetId);
        const status = document.getElementById('copy-one-status');
        status.textContent = 'コピー中…';
        status.style.color = 'var(--ink-soft)';
        try{
          await copyRecipesTo([r.id], targetId);
          status.textContent = `「${target.name}」にコピーしました。`;
          status.style.color = 'var(--sage)';
        }catch(e){
          status.textContent = 'コピーに失敗しました: ' + (e && e.message ? e.message : '');
          status.style.color = 'var(--clay)';
        }
      };
    };
  }
}

      if(!state.draft.stock[i]) state.draft.stock[i] = {name:'',qty:0,min:0,par:0,unit:''};

      state.draft.stock[i][f] = (f==='qty'||f==='min'||f==='par') ? (parseFloat(el.value)||0) : el.value;

    el.oninput = handler;
    el.onchange = handler;
  });

    };
    el.oninput = handler;
    el.onchange = handler;
  });
  slot.querySelectorAll('[data-rmmenu]').forEach(el=>{
    el.onclick = ()=>{
      syncFormFields();
      state.draft.menu.splice(parseInt(el.dataset.rmmenu,10), 1);
      if(!state.draft.menu.length) state.draft.menu.push({name:'',recipeId:''});
      render();
    };
  });
  const addMenuBtn = document.getElementById('add-menu');
  if(addMenuBtn) addMenuBtn.onclick = ()=>{

    if(!Array.isArray(state.draft.menu)) state.draft.menu = [];
    state.draft.menu.push({name:'',recipeId:''});

  slot.querySelectorAll('.ing-input').forEach(el=>{ el.oninput = ()=>draftIngInput(el); });

  const photoAdd = document.getElementById('photo-add');
  const photoFile = document.getElementById('photo-file');
  if(photoAdd && photoFile){
    photoAdd.onclick = ()=>photoFile.click();
    photoFile.onchange = ()=>{ addPhotosToDraft(photoFile.files); photoFile.value = ''; };

// Hold the selected images at full quality for OCR (compression happens later,
// only for the copy that gets attached to the recipe).
// iOS occasionally hands over a file with an empty MIME type, so fall back to
// checking the extension rather than silently dropping the photo.
function looksLikeImage(f){
  if(String(f.type||'').startsWith('image/')) return true;
  if(f.type) return false;
  return /\.(jpe?g|png|gif|webp|heic|heif|bmp|tiff?)$/i.test(f.name || '');
}

const MAX_SHOTS = 10;
async function addShots(files){
  const list = Array.from(files||[]);
  if(!list.length) return;
  if(!state.shots) state.shots = [];

  for(const f of list){
    if(state.shots.length >= MAX_SHOTS){
      state.banner = {type:'info', text:`一度に読み取れるのは${MAX_SHOTS}枚までです。`};
      break;
    }
    if(!looksLikeImage(f)) continue;
    try{
      const dataUri = await new Promise((resolve,reject)=>{
        const r = new FileReader();
        r.onload = ()=>resolve(r.result);
        r.onerror = ()=>reject(new Error('読み込み失敗'));
        r.readAsDataURL(f);
      });
      state.shots.push({ dataUri, type: f.type || 'image/jpeg' });
    }catch(e){ /* skip unreadable file */ }
  }
  state.ocrText = '';
  state.ocrPages = [];
  render();
}

function wireFeed(){
  const btn    = document.getElementById('feed-refresh');
  const status = document.getElementById('feed-status');
  const list   = document.getElementById('feed-list');
  if(!btn || !status || !list) return;

  const paint = (items)=>{
    const done = feedDone();
    if(!items.length){ list.innerHTML = '<p class="tip">今は配信されているものがありません。</p>'; return; }
    list.innerHTML = items.map((it,i)=>{
      const isDone = done.includes(it.file);
      return `<div class="feed-item">
        <div style="flex:1; min-width:0">
          <div style="font-weight:600">${esc(it.label||it.file)}${isDone?' <span class="feed-done">受取済</span>':''}</div>

        </div>
        <button class="btn-secondary feed-get" data-i="${i}">${isDone?'もう一度受け取る':'受け取る'}</button>
      </div>`;
    }).join('');

    list.querySelectorAll('.feed-get').forEach(b=>{
      b.onclick = async ()=>{
        const it = items[+b.dataset.i];
        list.querySelectorAll('.feed-get').forEach(x=> x.disabled = true);
        status.style.color = 'var(--ink-soft)';
        status.textContent = '受け取り中…';
        try{
          const res = await fetch(feedUrl(it.file), { cache: 'no-store' });
          if(!res.ok) throw new Error('取得できませんでした（' + res.status + '）');
          const code = (await res.text()).trim();
          if(!code) throw new Error('中身が空でした');
          await importFromCode(code, status, { relink: true, onSaved: ()=> markFeedDone(it.file) });
        }catch(e){
          status.style.color = 'var(--clay)';
          status.textContent = (e && e.message) ? e.message : '受け取りに失敗しました。';
        }
        list.querySelectorAll('.feed-get').forEach(x=> x.disabled = false);
      };
    });
  };

  btn.onclick = async ()=>{
    btn.disabled = true;
    status.style.color = 'var(--ink-soft)';
    status.textContent = '確認中…';
    try{
      const items = await loadFeed();
      status.style.color = 'var(--sage)';
