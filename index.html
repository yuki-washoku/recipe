<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>わたしのレシピ帳</title>
<meta name="theme-color" content="#2B4570">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="レシピ帳">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

:root{
  --paper:#EFE6D3;
  --card:#FFFCF4;
  --ink:#2B2620;
  --ink-soft:#6b6152;
  --indigo:#2B4570;
  --indigo-soft:#e9eef4;
  --turmeric:#C99A3C;
  --clay:#A6503A;
  --sage:#6E7F5C;
  --line:#d9cdb0;
}
*{ box-sizing:border-box; }
body{
  margin:0;
  background:var(--paper);
  background-image:
    radial-gradient(circle at 20% 10%, rgba(201,154,60,0.06), transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(43,69,112,0.06), transparent 40%);
  color:var(--ink);
  font-family:'Zen Kaku Gothic New', sans-serif;
  min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
}
#app{ max-width:900px; margin:0 auto; padding:28px 18px 60px; }
/* A wide child should scroll inside its own box, never drag the page with it. */
html, body{ max-width:100%; overflow-x:hidden; }
#app, .card{ min-width:0; }
h1,h2,h3{ font-family:'Shippori Mincho', serif; margin:0; font-weight:700; }
.mono{ font-family:'JetBrains Mono', monospace; }

header.top{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px; gap:12px; flex-wrap:wrap; }
header.top h1{ font-size:26px; letter-spacing:.03em; }
header.top .sub{ font-size:12px; color:var(--ink-soft); }

.tabs{ display:flex; gap:6px; border-bottom:3px solid var(--indigo); margin-bottom:22px; flex-wrap:wrap; }
.tab{
  padding:10px 18px; background:var(--line); color:var(--ink-soft);
  font-family:'Shippori Mincho', serif; font-size:14px;
  clip-path:polygon(8% 0,92% 0,100% 100%,0% 100%);
  cursor:pointer; border:none; transition:transform .15s ease;
}
.tab:hover{ transform:translateY(-1px); }
.tab.active{ background:var(--indigo); color:#fff; transform:translateY(2px); }

.card{
  position:relative; overflow:hidden;
  background:var(--card); border:1px solid var(--line);
  border-radius:4px 14px 4px 4px; box-shadow:2px 3px 0 rgba(43,38,32,0.08);
  padding:20px;
}
.card::after{
  content:''; position:absolute; top:8px; right:12px; width:44px; height:44px;
  border-radius:50%; background:radial-gradient(circle, rgba(201,154,60,0.20), transparent 70%);
  pointer-events:none;
}

.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
.recipe-card{ cursor:pointer; display:flex; flex-direction:column; gap:8px; }
.recipe-card .tab-ribbon{
  position:absolute; top:-2px; right:16px; width:34px; height:22px; background:var(--turmeric);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);
}
.recipe-card h3{ font-size:17px; line-height:1.4; padding-right:30px; }
.recipe-card .meta{ font-size:12px; color:var(--ink-soft); }
.recipe-card .tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; }
.chip{ font-size:11px; background:var(--indigo-soft); color:var(--indigo); padding:2px 8px; border-radius:10px; }

.searchbar{ display:flex; gap:10px; margin-bottom:18px; }
input[type=text], input[type=email], textarea, select{
  font-family:'Zen Kaku Gothic New', sans-serif; font-size:16px;
  border:1px solid var(--line); border-radius:6px; padding:9px 12px; background:#fffefb; color:var(--ink);
  width:100%;
}
textarea{ resize:vertical; min-height:70px; }
label{ font-size:12px; color:var(--ink-soft); display:block; margin-bottom:4px; margin-top:14px; }
label:first-child{ margin-top:0; }

button{
  font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:13px;
  border:none; border-radius:6px; padding:10px 18px; cursor:pointer; transition:opacity .15s ease;
}
button:hover{ opacity:.88; }
button:disabled{ opacity:.5; cursor:not-allowed; }
.btn-primary{ background:var(--indigo); color:#fff; }
.btn-secondary{ background:var(--line); color:var(--ink); }
.btn-danger{ background:var(--clay); color:#fff; }
.row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.row-between{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }

.ing-row, .step-row{ display:flex; gap:8px; margin-bottom:8px; align-items:flex-start; }
.ing-row input{ flex:1; }
.step-row textarea{ flex:1; }
.step-num{
  font-family:'JetBrains Mono', monospace; font-weight:600; color:var(--indigo);
  width:24px; text-align:right; padding-top:9px; flex-shrink:0;
}
.remove-btn{ background:none; border:none; color:var(--clay); cursor:pointer; font-size:16px; padding:6px; }
.insert-btn{ background:transparent; color:var(--indigo); border:1px dashed var(--line); font-size:12px; padding:5px 12px; margin-bottom:8px; }

.empty{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
.empty h3{ margin-bottom:8px; color:var(--ink); }

.detail h2{ font-size:24px; margin-bottom:6px; }
.detail .meta-row{ font-size:13px; color:var(--ink-soft); margin-bottom:18px; }
.section-label{
  font-family:'Shippori Mincho', serif; font-size:14px; color:var(--indigo);
  border-bottom:2px solid var(--turmeric); display:inline-block; padding-bottom:2px; margin-bottom:12px; margin-top:22px;
}
.ing-list{ list-style:none; padding:0; margin:0; }
.ing-list li{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line); font-size:14px; gap:12px; }
.ing-list .amt{ font-family:'JetBrains Mono', monospace; color:var(--ink-soft); white-space:nowrap; }
.steps-list{ list-style:none; padding:0; margin:0; counter-reset:step; }
.steps-list li{ counter-increment:step; display:flex; gap:12px; padding:10px 0; border-bottom:1px dashed var(--line); font-size:14px; line-height:1.6; }
.steps-list li::before{
  content:counter(step); font-family:'JetBrains Mono', monospace; font-weight:700; color:#fff;
  background:var(--indigo); width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  flex-shrink:0; font-size:12px;
}
.menu-row{ display:flex; gap:8px; margin-bottom:10px; align-items:flex-start; }
.menu-num{
  font-family:'JetBrains Mono',monospace; font-weight:600; color:var(--indigo);
  width:22px; text-align:right; padding-top:10px; flex-shrink:0;
}
.menu-fields{ flex:1; display:flex; flex-direction:column; gap:6px; }
.menu-select{ font-size:13px; }

.menu-view{ list-style:none; padding:0; margin:0; }
.menu-view li{
  display:flex; align-items:center; gap:12px; padding:13px 0;
  border-bottom:1px dashed var(--line); font-size:15px;
}
.menu-view li.linked{ cursor:pointer; }
.menu-view li.linked:active{ background:var(--indigo-soft); }
.menu-order{
  flex-shrink:0; width:24px; height:24px; border-radius:50%;
  background:var(--turmeric); color:#fff; font-size:12px; font-weight:700;
  font-family:'JetBrains Mono',monospace;
  display:flex; align-items:center; justify-content:center;
}
.menu-name{ flex:1; }
.menu-view li.linked .menu-name{ color:var(--indigo); font-weight:700; }
.menu-make{
  background:var(--turmeric); color:#fff; border:none; border-radius:12px;
  padding:5px 10px; font-size:11px; font-weight:700; white-space:nowrap;
}
.menu-go{ font-size:12px; color:var(--indigo); white-space:nowrap; }
.menu-missing{ font-size:11px; color:var(--clay); white-space:nowrap; }

.task-libs{ display:flex; flex-direction:column; gap:12px; margin-bottom:14px; }
.task-lib{
  background:#fffefb; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
}
.task-lib-head{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  margin-bottom:8px; font-size:13px;
}
.task-chips{ display:flex; flex-wrap:wrap; gap:6px; }
.task-chip{
  background:var(--indigo-soft); color:var(--indigo); border:none;
  border-radius:14px; padding:6px 11px; font-size:12px; font-weight:700;
  display:inline-flex; align-items:center; gap:5px;
}
.task-chip:active{ background:var(--indigo); color:#fff; }
.task-chip.on{ background:var(--indigo); color:#fff; }

/* English panel: read at arm's length across a table, so the type is large
   and the English leads with the Japanese underneath for the cook. */
.en-panel{
  margin-top:14px; padding:16px; border-radius:12px;
  background:#f7f9fc; border:1px solid #dde4ef;
}
.en-head{
  font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
  color:var(--indigo); margin-bottom:8px;
}
.en-title{ font-size:20px; font-weight:700; line-height:1.35; }
.en-desc{ font-size:16px; line-height:1.65; margin:10px 0 0; }
.en-menu{ margin:12px 0 0; padding-left:0; list-style:none; counter-reset:enc; }
.en-menu li{
  counter-increment:enc; padding:10px 0 10px 30px; position:relative;
  border-top:1px solid #e4eaf4;
}
.en-menu li:first-child{ border-top:none; }
.en-menu li::before{
  content:counter(enc); position:absolute; left:0; top:12px;
  font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; color:var(--indigo);
}
.en-item-en{ font-size:16px; font-weight:700; line-height:1.4; }
.en-item-desc{ font-size:14px; line-height:1.55; margin-top:2px; }
.en-item-ja{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
.en-aller{ margin-top:12px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.en-aller-label{
  font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  color:var(--clay);
}
.en-chip{
  font-size:12px; font-weight:700; color:var(--clay);
  background:#fbf1ee; border:1px solid #e8cdc4; border-radius:999px; padding:3px 9px;
}
.en-panel input, .en-panel textarea{ font-size:15px; }
.task-dur{
  font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:600;
  background:rgba(43,38,32,.10); border-radius:8px; padding:1px 5px;
}

.prep-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px;
  margin-bottom:6px;
}
.prep-grid label{ margin-top:0; }
.plan-bar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--indigo-soft); border-radius:10px; padding:14px 16px;
  margin-bottom:16px; flex-wrap:wrap;
}

.reconnect-chip{
  border:none; cursor:pointer; font-size:11px; padding:3px 10px;
  font-weight:700; margin-left:4px;
}
.update-bar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--turmeric); color:#fff; border-radius:8px;
  padding:10px 14px; margin-bottom:14px; font-size:13px; font-weight:700;
}
.update-bar button{
  background:rgba(255,255,255,.22); color:#fff; border:none;
  border-radius:6px; padding:7px 14px; font-size:12px; font-weight:700;
}

.stock-head{
  display:grid; grid-template-columns:1fr 54px 54px 54px 46px 30px; gap:5px;
  font-size:10px; color:var(--ink-soft); padding:0 2px 4px; margin-top:6px;
}
.stock-row{
  display:grid; grid-template-columns:1fr 54px 54px 54px 46px 30px; gap:5px;
  align-items:center; margin-bottom:7px;
}
.stock-input{ font-size:14px; padding:8px 6px; min-width:0; }
/* The editor has six columns; below ~420px the name gets its own line so the
   numbers stay wide enough to tap. */
@media (max-width:420px){
  .stock-head{ display:none; }
  .stock-row{
    grid-template-columns:repeat(4,1fr) 30px;
    grid-template-areas:'n n n n x' 'q m p u u';
    gap:6px; padding:8px; margin-bottom:10px;
    background:var(--indigo-soft); border-radius:8px;
  }
  .stock-row input[data-sfield='name']{ grid-area:n; }
  .stock-row input[data-sfield='qty']{ grid-area:q; }
  .stock-row input[data-sfield='min']{ grid-area:m; }
  .stock-row input[data-sfield='par']{ grid-area:p; }
  .stock-row input[data-sfield='unit']{ grid-area:u; }
  .stock-row .remove-btn{ grid-area:x; }
}

/* 一覧 */
.stock-tools{
  display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0 4px;
}
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.seg button{
  background:#fffefb; border:none; color:var(--ink-soft);
  font-size:12px; font-weight:700; padding:7px 11px; white-space:nowrap;
}
.seg button + button{ border-left:1px solid var(--line); }
.seg button.on{ background:var(--indigo); color:#fff; }
.mini-btn.on{ background:var(--indigo); color:#fff; }

.stock-view{ list-style:none; padding:0; margin:0; }
.stock-view li{
  display:grid; grid-template-columns:1fr 76px 34px auto; gap:8px;
  align-items:center; padding:10px 2px; border-bottom:1px dashed var(--line);
  font-size:14px;
}
.stock-view li .stock-min{ grid-column:1 / -1; margin-top:-4px; }
.stock-view li .stock-gap{ grid-column:1 / -1; }
.stock-view li.low{ background:#fbf1ee; border-radius:8px; padding:10px 8px; }
.feed-item{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:12px 0; border-top:1px dashed var(--line);
}
.feed-item .btn-secondary{ flex:0 0 auto; }
.feed-done{
  font-size:11px; font-weight:600; color:var(--sage);
  border:1px solid var(--sage); border-radius:999px; padding:1px 7px; margin-left:4px;
}
.stock-name{ font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.stock-qty{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; }
.stock-qty-input,.stock-count{
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px;
  text-align:right; padding:9px 8px; border:1px solid var(--line);
  border-radius:8px; background:#fffefb; width:100%; min-width:0;
}
.stock-qty-input:focus,.stock-count:focus{ border-color:var(--indigo); outline:none; }
.stock-view li.low .stock-qty,.stock-view li.low .stock-qty-input{ color:var(--clay); }
.stock-unit{ font-size:12px; color:var(--ink-soft); }
.stock-min{ font-size:11px; color:var(--ink-soft); }
.stock-gap{ font-size:12px; font-weight:700; color:var(--clay); }
.stock-gap:empty{ display:none; }

.order-alert{
  background:#f7e4df; color:var(--clay); border-radius:8px;
  padding:12px 14px; margin-top:14px; font-size:13px; line-height:1.6;
}
.order-alert-head{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  flex-wrap:wrap;
}
.order-need{ list-style:none; padding:0; margin:8px 0 0; }
.order-need li{
  display:flex; justify-content:space-between; gap:12px;
  padding:5px 0; border-top:1px dashed rgba(166,91,69,.3);
}
.order-amt{ font-family:'JetBrains Mono',monospace; font-weight:700; white-space:nowrap; }
.order-hint{ font-size:11px; margin-top:8px; opacity:.85; line-height:1.6; }
.order-bar{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  width:100%; background:var(--clay); color:#fff; border:none;
  border-radius:8px; padding:11px 14px; margin-bottom:12px;
  font-size:13px; font-weight:700; text-align:left;
}
.sec-alert{
  display:inline-block; background:var(--clay); color:#fff;
  font-family:'JetBrains Mono',monospace; font-size:10px;
  border-radius:8px; padding:1px 6px; margin-left:4px;
}

/* The section switcher follows the page so it is reachable from anywhere in
   a long list. backdrop-filter is only a nicety; the solid background behind
   it is what makes the text readable while rows scroll under. */
.nav-stick{
  position:sticky; top:0; z-index:40;
  background:var(--cream);
  padding-top:8px; margin:0 -4px 4px; padding-left:4px; padding-right:4px;
  box-shadow:0 6px 10px -8px rgba(0,0,0,.25);
}
@supports (backdrop-filter: blur(6px)){
  .nav-stick{ background:color-mix(in srgb, var(--cream) 92%, transparent); backdrop-filter:blur(6px); }
}
.nav-stick .section-picker{ margin-bottom:8px; }
.nav-stick .tabs{ margin-bottom:8px; }

/* Touch targets. 44px is the smallest reliably tappable size on a phone, and
   these are pressed with wet or gloved hands in a kitchen. */
.tab{ min-height:40px; }
.btn-secondary,.btn-primary{ min-height:40px; }
.mini-btn{ min-height:32px; }
.recipe-card{ cursor:pointer; }
.recipe-card:active{ transform:scale(.995); }

.section-picker{
  display:flex; align-items:center; gap:10px; width:100%;
  background:var(--indigo); color:#fff; border:none;
  border-radius:10px; padding:13px 16px; margin-bottom:14px;
  font-family:'Shippori Mincho',serif; font-size:16px; font-weight:700;
}
.sp-label{ flex:1; text-align:left; }
.sp-count{
  font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600;
  background:rgba(255,255,255,.22); border-radius:10px; padding:2px 9px;
}
.sp-caret{ font-size:12px; opacity:.85; }

.sec-overlay{
  position:fixed; inset:0; z-index:9998; background:rgba(20,17,14,.5);
  display:flex; align-items:flex-end; justify-content:center;
}
.sec-sheet{
  width:100%; max-width:560px; max-height:86vh;
  background:var(--paper); border-radius:16px 16px 0 0;
  display:flex; flex-direction:column;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 24px rgba(0,0,0,.25);
}
.sec-sheet-head{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:12px; font-family:'Shippori Mincho',serif; font-size:16px;
}
.sec-close{
  width:34px; height:34px; border-radius:50%; border:none;
  background:var(--line); color:var(--ink); font-size:15px;
}
.sec-scroll{ overflow-y:auto; -webkit-overflow-scrolling:touch; }
.sec-group{ margin-bottom:16px; }
.sec-group-title{
  font-size:12px; color:var(--ink-soft); font-weight:700; margin-bottom:7px;
}
.sec-tiles{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
.sec-tile{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:14px 14px; font-size:14px; font-weight:700; color:var(--ink);
  text-align:left; min-width:0;
}
.sec-tile > span:first-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sec-tile.wide{ grid-column:1 / -1; }
.sec-tile.active{ background:var(--indigo); color:#fff; border-color:var(--indigo); }
.sec-tile-count{
  font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600;
  background:rgba(43,38,32,.10); border-radius:9px; padding:2px 7px; flex-shrink:0;
}
.sec-tile.active .sec-tile-count{ background:rgba(255,255,255,.22); }

.check-list{ list-style:none; padding:0; margin:0; }
.check-list li{
  display:flex; gap:12px; align-items:flex-start; padding:11px 0;
  border-bottom:1px dashed var(--line); font-size:14px; line-height:1.6;
  cursor:pointer; user-select:none;
}
.check-box{
  flex-shrink:0; width:22px; height:22px; border-radius:6px;
  border:2px solid var(--indigo); background:#fffefb; color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700; margin-top:1px;
}
.check-list li.done .check-box{ background:var(--sage); border-color:var(--sage); }
.check-list li.done .check-text{ color:var(--ink-soft); text-decoration:line-through; }
.kind-chip{
  display:inline-block; font-size:10px; background:var(--indigo); color:#fff;
  padding:1px 7px; border-radius:9px; margin-right:6px; vertical-align:1px;
}

.notes-box{ background:var(--indigo-soft); border-radius:8px; padding:12px 14px; font-size:13px; color:var(--ink-soft); margin-top:16px; white-space:pre-wrap; }

.dropzone{
  border:2px dashed var(--line); border-radius:10px; padding:30px; text-align:center; color:var(--ink-soft);
  cursor:pointer; background:#fffefb;
}
.dropzone:hover{ border-color:var(--indigo); }
.preview-img{ max-width:100%; max-height:320px; border-radius:8px; margin-top:14px; display:block; }

.banner{ padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:16px; }
.banner.error{ background:#f7e4df; color:var(--clay); }
.banner.info{ background:var(--indigo-soft); color:var(--indigo); }

<script>
// If the module below never runs (e.g. a library failed to load while
// offline), replace the endless "loading" text with something actionable.
window.__appBooted = false;

// ---------------------------------------------------------------------------
// Safe mode and failure reporting.
//
// A phone cannot show a JavaScript console, so a crash used to appear as a
// blank white screen with nothing to report and nothing to do. These two
// mechanisms turn that into a readable message and a way out, and they are
// deliberately the first thing in the file so they work even if everything
// after them fails.
(function(){

  function appEl(){ return document.getElementById('app'); }

  function panel(title, detail, extra){
    var e = appEl();
    if (!e) {
      e = document.createElement('div');
      e.id = 'app';
      document.body.appendChild(e);
    }
    e.innerHTML =
      '<div style="font-family:-apple-system,sans-serif;padding:28px 20px;max-width:640px;margin:0 auto;color:#2B2B2B">' +
        '<h2 style="margin:0 0 10px">' + title + '</h2>' +
        '<p style="margin:0 0 16px;line-height:1.7">' + detail + '</p>' +
        (extra || '') +
        '<p style="margin-top:22px">' +
          '<button onclick="location.href=location.pathname+\'?safe=1\'" ' +
            'style="background:#2B4570;color:#fff;border:none;border-radius:8px;' +
            'padding:12px 20px;font-weight:700;font-size:15px">保存データを消して再起動</button>' +
        '</p>' +
        '<p style="margin-top:10px;font-size:13px;color:#6B6B6B;line-height:1.7">' +
          'レシピは消えません。端末に一時保存した表示用データだけを消して、サーバーから読み直します。' +
        '</p>' +
      '</div>';
    document.body.style.background = '#FFFDF8';
  }
  window.__showFatal = panel;

  // Safe mode: ?safe=1 tears down the service worker and every cache, then
  // reloads clean. This is the escape hatch for a bad cached build — without
  // it, a broken cached page keeps serving itself and the app can never
  // recover on its own.
  if (location.search.indexOf('safe=1') >= 0) {
    window.__safeMode = true;
    panel('復旧しています…', '保存データを消しています。そのままお待ちください。');
    (function(){
      var jobs = [];
      try {
        if ('serviceWorker' in navigator) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
            return Promise.all(rs.map(function(r){ return r.unregister(); }));
          }).catch(function(){}));
        }
        if ('caches' in window) {
          jobs.push(caches.keys().then(function(ks){
            return Promise.all(ks.map(function(k){ return caches.delete(k); }));
          }).catch(function(){}));
        }
      } catch (e) {}
      Promise.all(jobs).catch(function(){}).then(function(){
        setTimeout(function(){ location.replace(location.pathname); }, 400);
      });
    })();
    return;
  }

  // failure is invisible: the page just stays blank.
  var reported = false;
  function report(what, err){
    if (reported) return;
    reported = true;
    var msg = '';
    try {
      msg = (err && (err.message || err.reason && (err.reason.message || err.reason) || err)) || '';
      msg = String(msg).slice(0, 400);
    } catch (e) { msg = '(詳細不明)'; }
    panel('アプリを開けませんでした',
      'この内容をスクリーンショットで送っていただければ原因が特定できます。',
      '<pre style="white-space:pre-wrap;word-break:break-all;background:#F3EFE6;' +
      'padding:12px;border-radius:8px;font-size:12px;line-height:1.7;margin:0">' +
      what + '\n' + msg.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</pre>');
  }

    // Ignore failures of individual images and other subresources.
    if (e && e.target && e.target !== window) return;

    report('未処理の失敗', e);
  });

  // caught the problem but the screen is blank all the same. Say so rather
  // than leaving a white rectangle.
  setTimeout(function(){
    if (reported) return;
    var e = appEl();
    var empty = !e || e.innerHTML.replace(/\s/g,'').length < 40;
    if (empty) {
      reported = true;
      panel('画面が表示されませんでした',
        'アプリは読み込まれましたが、中身が表示されませんでした。下のボタンで復旧できます。');
    }
  }, 20000);
})();

// ---------------------------------------------------------------------------
// Service worker registration lives HERE, in a plain script with no imports,
// and not in the module below.
//
// The module below starts with `import ... from "https://www.gstatic.com/..."`.
// A module whose imports fail does not run at all — not one line. Registration
// used to sit at the end of that module, so whenever the Firebase CDN was slow
// or unreachable (exactly the weak-signal case offline support exists for) the
// worker was never registered, nothing was ever cached, and the next launch
// without a connection had nothing to open. Registering here means offline

    // nothing is intercepted, so an offline launch would still fail.

    window.__swStatus = 'failed';
    window.__swError = String((err && err.message) || err);
    return null;
  });

// only much later — and only when actually offline — is it reported as a
// problem. The app also keeps trying in the background either way.
(function bootWatchdog(){
  var el = function(){ return document.getElementById('app'); };
  var btn = 'style="background:#2B4570;color:#fff;border:none;border-radius:6px;' +
            'padding:10px 18px;font-weight:700;cursor:pointer"';

  if (window.__safeMode) return;

  // 6s: still loading, just say so.
  setTimeout(function(){
    if (window.__appBooted) return;
    var e = el(); if (!e) return;
    e.innerHTML =
      '<div class="empty">' +
        '<h3>読み込んでいます…</h3>' +
        '<p>通信が遅い場合、少し時間がかかることがあります。</p>' +
      '</div>';
  }, 6000);

  // 25s: give the person something to act on.
  setTimeout(function(){
    if (window.__appBooted) return;
    var e = el(); if (!e) return;
    var offline = (typeof navigator !== 'undefined' && navigator.onLine === false);
    e.innerHTML =
      '<div class="empty">' +
        '<h3>' + (offline ? 'オフラインのため開けません' : '読み込みに時間がかかっています') + '</h3>' +
        '<p>' + (offline
          ? '一度オンラインでアプリを開くと、次回から通信なしで使えるようになります。'
          : '電波の弱い場所では時間がかかることがあります。そのままお待ちいただくか、再読み込みしてください。') +
        '</p>' +
        '<p style="margin-top:14px"><button onclick="location.reload()" ' + btn + '>再読み込み</button></p>' +
      '</div>';
  }, 25000);

  // Coming back online is the most likely moment for a stalled load to work.
  window.addEventListener('online', function(){
    if (!window.__appBooted) location.reload();
  });
})();

  const map = {
    'auth/invalid-email': 'メールアドレスの形式が正しくありません。',
    'auth/invalid-credential': 'メールアドレスまたはパスワードが違います。',
    'auth/wrong-password': 'パスワードが違います。',
    'auth/user-not-found': 'このメールアドレスは登録されていません。「初めての方」から登録してください。',
    'auth/email-already-in-use': 'このメールアドレスは登録済みです。「ログイン」からお進みください。',

    'auth/too-many-requests': '試行回数が多すぎます。しばらく待ってからお試しください。',

}

const LAST_NOTEBOOK_KEY = 'lastNotebookId';
const SORT_KEY = 'recipeSort';

// Japanese-aware comparison. Katakana is folded to hiragana so that
// 「カレー」and「かれー」sort together.
const jaCollator = new Intl.Collator('ja', { sensitivity:'base', numeric:true });

function toHiragana(s){
  return String(s||'').replace(/[\u30a1-\u30f6]/g, c =>
    String.fromCharCode(c.charCodeAt(0) - 0x60)
  );
}

// Sort by the reading if one was entered, otherwise by the title itself.
function sortName(r){
  return toHiragana((r.reading && r.reading.trim()) ? r.reading : (r.title || '')).trim();
}

function sortRecipes(list){
  if(state.sort === 'kana'){
    list.sort((a,b)=>jaCollator.compare(sortName(a), sortName(b)));
  }else{
    list.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  }
  return list;
}

function setSort(mode){
  state.sort = mode;
  try{ window.localStorage.setItem(SORT_KEY, mode); }catch(e){}
  sortRecipes(state.recipes);
  render();
}



function normEmail(e){ return (e||'').trim().toLowerCase(); }

// Subscribe to the notebooks this user is a member of.
function subscribeNotebooks(){
  if(state.unsubNotebooks){ state.unsubNotebooks(); state.unsubNotebooks = null; }
  const email = normEmail(state.user && state.user.email);
  const q = query(collection(db, 'notebooks'), where('members', 'array-contains', email));
  state.unsubNotebooks = onSnapshot(q, async snap=>{
    const list = [];
    snap.forEach(d=>list.push(Object.assign({}, d.data(), {id: d.id})));
    list.sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
    state.notebooks = list;

    if(!list.length){
      // First run for this user: create a personal notebook automatically.
      if(!state.creatingDefault){
        state.creatingDefault = true;
        try{ await createNotebook('個人用'); }
        catch(e){
          state.banner = {type:'error', text:'レシピ帳の作成に失敗しました: ' + (e && e.message ? e.message : '')};
        }
        state.creatingDefault = false;
      }
      return;
    }

    // Keep or pick the active notebook.
    let saved = null;
    try{ saved = window.localStorage.getItem(LAST_NOTEBOOK_KEY); }catch(e){}
    const stillValid = state.currentNotebookId && list.some(n=>n.id===state.currentNotebookId);
    if(!stillValid){
      const preferred = list.find(n=>n.id===saved);
      state.currentNotebookId = preferred ? preferred.id : list[0].id;
    }
    rememberNotebook(state.currentNotebookId);
    subscribeRecipes();
    state.ready = true;
    render();
  }, err=>{
    state.ready = true;
    state.banner = {type:'error', text:'レシピ帳の読み込みに失敗しました: ' + (err && err.message ? err.message : '不明なエラー')};
    render();
  });
}

function rememberNotebook(id){
  try{ window.localStorage.setItem(LAST_NOTEBOOK_KEY, id); }catch(e){}
}

function currentNotebook(){
  return state.notebooks.find(n=>n.id===state.currentNotebookId) || null;
}

async function createNotebook(name){
  const email = normEmail(state.user && state.user.email);
  const id = 'nb_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  await setDoc(doc(db, 'notebooks', id), {
    name: name || '新しいレシピ帳',
    owner: email,
    admins: [email],
    members: [email],

  });
  state.currentNotebookId = id;

}

// Older notebooks were created before multiple admins existed; treat the
// owner as the sole admin in that case.
function adminsOf(nb){
  if(!nb) return [];
  if(Array.isArray(nb.admins) && nb.admins.length) return nb.admins.map(normEmail);
  return nb.owner ? [normEmail(nb.owner)] : [];
}
function isAdminOf(nb){
  return adminsOf(nb).includes(normEmail(state.user && state.user.email));
}
function isOwnerOf(nb){
  return nb && normEmail(nb.owner) === normEmail(state.user && state.user.email);
}

}

/* ---------------- Invite links ---------------- */

const INVITE_PARAM = 'invite';

function genInviteToken(){
  const chars = 'abcdefghijkmnpqrstuvwxyz23456789'; // no ambiguous chars
  let s = '';
  for(let i=0;i<10;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function expiryToTimestamp(choice){
  if(choice === 'none') return null;
  const days = { '1d':1, '7d':7, '30d':30 }[choice] || null;
  if(!days) return null;
  return Timestamp.fromDate(new Date(Date.now() + days*24*60*60*1000));
}

async function createInvite(notebookId, notebookName, expiryChoice){
  const token = genInviteToken();
  await setDoc(doc(db, 'invites', token), {
    notebookId,
    notebookName: notebookName || '',
    createdBy: normEmail(state.user && state.user.email),
    createdAt: new Date().toISOString(),
    expiresAt: expiryToTimestamp(expiryChoice),
    revoked: false,
    uses: 0
  });
  return token;
}

function buildInviteUrl(token){
  return `${location.origin}${location.pathname}?${INVITE_PARAM}=${token}`;
}

async function listInvites(notebookId){
  const snap = await getDocs(query(collection(db, 'invites'), where('notebookId','==',notebookId)));
  const list = [];
  snap.forEach(d=>list.push(Object.assign({}, d.data(), {id: d.id})));
  list.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  return list;
}

async function revokeInvite(token){
  await updateDoc(doc(db, 'invites', token), { revoked: true });
}

function inviteExpiryMs(inv){
  if(!inv || !inv.expiresAt) return null;
  if(typeof inv.expiresAt.toMillis === 'function') return inv.expiresAt.toMillis();
  const t = new Date(inv.expiresAt).getTime();
  return isNaN(t) ? null : t;
}

function inviteIsValid(inv){
  if(!inv) return false;
  if(inv.revoked) return false;
  const exp = inviteExpiryMs(inv);
  if(exp !== null && exp < Date.now()) return false;
  return true;
}

// Called once, right after the user is signed in, if the URL carried an
// invite token. Joins the notebook and switches to it.
async function redeemPendingInvite(){
  const token = state.pendingInvite;
  if(!token) return;
  state.redeemingInvite = true;

  try{
    const invRef = doc(db, 'invites', token);
    const invSnap = await getDoc(invRef);
    if(!invSnap.exists()){
      state.banner = {type:'error', text:'招待リンクが見つかりませんでした。URLを確認するか、発行者に再発行を依頼してください。'};
      return;
    }
    const inv = invSnap.data();
    if(!inviteIsValid(inv)){
      state.banner = {type:'error', text:'この招待リンクは無効になっています（期限切れ、または取り消し済み）。発行者に再発行を依頼してください。'};
      return;
    }

    const email = normEmail(state.user.email);
    const nbRef = doc(db, 'notebooks', inv.notebookId);

    // Already a member? Just switch to it — no write needed (and the rules
    // wouldn't allow one anyway, since nothing would actually change).
    let alreadyMember = false;
    try{
      const nbSnap = await getDoc(nbRef);
      if(nbSnap.exists() && (nbSnap.data().members||[]).map(normEmail).includes(email)){
        alreadyMember = true;
      }
    }catch(e){ /* not readable yet = not a member, which is expected */ }

    if(!alreadyMember){
      await updateDoc(nbRef, {
        members: arrayUnion(email),
        lastInviteRedeemed: { token, email, at: new Date().toISOString() }
      });
      updateDoc(doc(db,'invites',token), { uses: (inv.uses||0) + 1 }).catch(()=>{});
    }

    state.currentNotebookId = inv.notebookId;
    rememberNotebook(inv.notebookId);
    state.banner = {type:'success', text: alreadyMember
      ? `「${inv.notebookName||'レシピ帳'}」にはすでに参加しています。`
      : `「${inv.notebookName||'レシピ帳'}」に参加しました。`};
  }catch(e){
    state.banner = {type:'error', text:'招待の処理に失敗しました: ' + (e && e.message ? e.message : '')};
  }finally{
    state.pendingInvite = null;
    state.redeemingInvite = false;
    const url = new URL(location.href);
    url.searchParams.delete(INVITE_PARAM);
    history.replaceState(null, '', url.pathname + url.search + url.hash);
  }
}

// Every change writes a snapshot of the PREVIOUS state, so any edit can be
// reviewed and rolled back later.
// Firestore applies a write to the local cache immediately, but the promise it
// returns only settles once the server acknowledges it — which never happens
// while offline. Waiting on that promise is what made the app appear to freeze
// on a weak connection. Here the write is given a short window to confirm; if
// it doesn't, it is treated as safely queued and the UI moves on.
const WRITE_CONFIRM_MS = 1500;

function writeLocalFirst(promise){
  return new Promise((resolve, reject)=>{
    let done = false;
    const timer = setTimeout(()=>{
      if(!done){ done = true; resolve({ queued: true }); }
    }, WRITE_CONFIRM_MS);
    promise.then(
      ()=>{ if(!done){ done = true; clearTimeout(timer); resolve({ queued:false }); } },
      err=>{
        if(!done){ done = true; clearTimeout(timer); reject(err); }
        else{
          // Rejected after we already moved on (e.g. rules denied it).
          console.warn('deferred write failed', err);
          state.banner = {type:'error', text:'保存できませんでした: ' + (err && err.message ? err.message : '')};
          try{ render(); }catch(e){}
        }
      }
    );
  });
}

async function logHistory(action, before, after){
  try{
    // Photos are large; storing them in every history entry would blow past
    // Firestore's document limit. Only the text fields are snapshotted.
    let slim = null;
    if(before){
      slim = Object.assign({}, before);
      slim.photos = undefined;
      delete slim.photos;
    }
    const id = 'h_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    // Fire and forget: the audit entry must not hold up the actual edit.
    setDoc(doc(db, 'history', id), {
      notebookId: state.currentNotebookId,
      recipeId: (before && before.id) || (after && after.id) || '',
      recipeTitle: (before && before.title) || (after && after.title) || '',
      action: action,                       // 'create' | 'update' | 'delete'
      before: slim ? JSON.stringify(slim) : '',
      by: state.user ? state.user.email : '',
      at: new Date().toISOString()
    }).catch(err=>console.warn('history log failed', err));
  }catch(e){
    // History is best-effort: never block the actual edit.
    console.warn('history log failed', e);
  }
}

/* ---------------- Photos ---------------- */

// Photos are stored inline with the recipe, so they must stay well under
// Firestore's 1MB document limit. Images are resized and re-encoded as JPEG
// before saving.
const MAX_PHOTOS = 12;
const PHOTO_QUALITY = 0.68;

// Photos live inside the recipe document, which Firestore caps at 1MB total.
// 900KB is reserved for images, leaving room for the text fields.
const PHOTO_BUDGET = 940 * 1024;

// The first photos are usually the ones that must stay readable (a menu sheet,
// the finished plate), so they get more pixels and more bytes. Later photos are
// reference shots of individual dishes, where a smaller image is fine — and
// this is what makes a full course of 12 fit at all.
// Only the first photo is treated as the important one (typically the menu
// sheet or the finished plate). The rest are reference shots of individual
// dishes, so they are stored smaller — and crucially at fewer pixels, since
// for a fixed byte budget a smaller image looks better than a heavily
// compressed large one.
const PHOTO_PRIORITY_SLOTS = 1;
const PHOTO_PX_PRIORITY = 1200;   // enough to read printed text
const PHOTO_PX_NORMAL = 800;
const PHOTO_TARGET_PRIORITY = 150 * 1024;
const PHOTO_TARGET_MIN = 30 * 1024;

const photoTargetFor_compat = (list)=>photoPlanFor(list);

function photoPlanFor(existingPhotos){
  const list = existingPhotos || [];
  const used = photosSize(list);
  const remaining = Math.max(0, PHOTO_BUDGET - used);

  if(list.length < PHOTO_PRIORITY_SLOTS){
    return {
      maxPx: PHOTO_PX_PRIORITY,
      target: Math.min(PHOTO_TARGET_PRIORITY, Math.max(PHOTO_TARGET_MIN, remaining))
    };
  }
  const slotsLeft = Math.max(1, MAX_PHOTOS - list.length);
  const share = Math.floor(remaining / slotsLeft);
  return {
    maxPx: PHOTO_PX_NORMAL,
    target: Math.max(PHOTO_TARGET_MIN, Math.min(PHOTO_TARGET_PRIORITY, share))
  };
}

function compressImage(file, targetBytes, maxPx){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('画像を読み込めませんでした'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('画像を読み込めませんでした'));
      img.onload = ()=>{
        const target = targetBytes || PHOTO_TARGET_PRIORITY;
        const startPx = maxPx || PHOTO_PX_PRIORITY;
        const MIN_PX = 240;

        const renderAt = (longEdge, quality)=>{
          const scale = Math.min(1, longEdge / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          return canvas.toDataURL('image/jpeg', quality);
        };

        // Detailed photos (food, printed pages) often cannot reach a small
        // target by lowering quality alone. Once quality bottoms out the
        // resolution is reduced as well, which both hits the target and looks
        // better than an extremely low-quality large image.
        let longEdge = startPx;
        let smallest = null;

        while(true){
          let quality = PHOTO_QUALITY;
          let out = renderAt(longEdge, quality);
          while(out.length > target && quality > 0.34){
            quality -= 0.07;
            out = renderAt(longEdge, quality);
          }
          if(!smallest || out.length < smallest.length) smallest = out;
          if(out.length <= target || longEdge <= MIN_PX){
            resolve(out.length <= target ? out : smallest);
            return;
          }
          longEdge = Math.max(MIN_PX, Math.round(longEdge * 0.8));
        }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function photosSize(photos){
  return (photos||[]).reduce((n,p)=>n + (p ? p.length : 0), 0);
}

async function addPhotosToDraft(files){
  const list = Array.from(files||[]);
  if(!list.length) return;
  syncFormFields();
  const photos = state.draft.photos || (state.draft.photos = []);

  for(const f of list){
    if(photos.length >= MAX_PHOTOS){
      state.banner = {type:'info', text:`写真は1つのレシピにつき${MAX_PHOTOS}枚までです。`};
      break;
    }
    if(!looksLikeImage(f)){
      state.banner = {type:'error', text:'画像ファイルを選んでください。'};
      continue;
    }
    try{
      const plan = photoTargetFor_compat(photos);
      let data = await compressImage(f, plan.target, plan.maxPx);

      // If it still overshoots, squeeze it into exactly the space that is
      // left rather than giving up on this and every later photo.
      let remaining = PHOTO_BUDGET - photosSize(photos);
      if(data.length > remaining){
        const slotsLeft = Math.max(1, MAX_PHOTOS - photos.length);
        const fair = Math.max(PHOTO_TARGET_MIN, Math.floor(remaining / slotsLeft));
        data = await compressImage(f, Math.min(fair, remaining), PHOTO_PX_NORMAL);
      }

      remaining = PHOTO_BUDGET - photosSize(photos);
      if(data.length > remaining){
        state.banner = {type:'info', text:`保存容量がいっぱいのため、${photos.length}枚で止めました。`};
        break;
      }
      photos.push(data);
    }catch(e){
      state.banner = {type:'error', text:'画像の処理に失敗しました: ' + (e && e.message ? e.message : '')};
    }
  }
  render();

async function saveRecipe(recipe){
  if(!state.currentNotebookId) throw new Error('レシピ帳が選択されていません。');
  if(!canEdit()) throw new Error('このレシピ帳では閲覧のみ許可されています。');

  const existing = state.recipes.find(r=>r.id===recipe.id) || null;
  const ref = doc(db, 'recipes', recipe.id);
  const payload = {
    notebookId: state.currentNotebookId,
    kind: recipe.kind || 'recipe',
    menu: normalizeMenu(recipe.menu),
    stock: normalizeStock(recipe.stock),
    scope: recipe.scope || '',
    title: recipe.title || '',
    reading: recipe.reading || '',
    photos: recipe.photos || [],
    servings: recipe.servings || '',
    tags: recipe.tags || [],
    ingredients: recipe.ingredients || [],
    steps: recipe.steps || [],
    notes: recipe.notes || '',
    // English explanation for overseas guests. Stored on the recipe so it is
    // there without a signal, and survives every later edit.
    en: recipe.en || null,
    createdAt: recipe.createdAt || new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    updatedBy: state.user ? state.user.email : ''
  };
  const res = await writeLocalFirst(setDoc(ref, payload));
  logHistory(existing ? 'update' : 'create', existing, payload);
  return res;
}

async function removeRecipe(id){
  if(!canEdit()) throw new Error('このレシピ帳では閲覧のみ許可されています。');
  const existing = state.recipes.find(r=>r.id===id) || null;
  const res = await writeLocalFirst(deleteDoc(doc(db, 'recipes', id)));
  logHistory('delete', existing, null);
  return res;
}

async function fetchHistory(){
  const snap = await getDocs(query(collection(db, 'history'), where('notebookId','==',state.currentNotebookId)));
  const list = [];
  snap.forEach(d=>list.push(Object.assign({}, d.data(), {id: d.id})));
  list.sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  return list.slice(0, 100);
}

async function restoreFromHistory(entry){
  if(!canEdit()) throw new Error('このレシピ帳では閲覧のみ許可されています。');
  if(!entry.before) throw new Error('この履歴には復元できる内容がありません。');
  const before = JSON.parse(entry.before);
  const current = state.recipes.find(r=>r.id===before.id) || null;
  const ref = doc(db, 'recipes', before.id);
  const payload = {
    notebookId: state.currentNotebookId,
    kind: before.kind || 'recipe',
    menu: normalizeMenu(before.menu),
    stock: normalizeStock(before.stock),
    scope: before.scope || '',
    title: before.title || '',
    reading: before.reading || '',
    // History snapshots don't carry photos, so keep whatever is on the
    // recipe right now rather than wiping the images.
    photos: (current && current.photos) || [],
    servings: before.servings || '',
    tags: before.tags || [],
    ingredients: before.ingredients || [],
    steps: before.steps || [],
    notes: before.notes || '',
    createdAt: before.createdAt || new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    updatedBy: state.user ? state.user.email : ''
  };
  await writeLocalFirst(setDoc(ref, payload));
  logHistory('update', current, payload);
}

// One-time migration: recipes saved before notebooks existed have no
// notebookId, so they are invisible. Adopt them into the given notebook.
async function migrateOrphanRecipes(notebookId){
  const snap = await getDocs(collection(db, 'recipes'));
  let moved = 0;
  for(const d of snap.docs){
    const data = d.data();
    if(!data.notebookId){
      await updateDoc(doc(db, 'recipes', d.id), { notebookId });
      moved++;
    }
  }
  return moved;
}

async function callClaudeExtract({image, mediaType, text}){
  const apiKey = getApiKey();
  if(!apiKey){
    throw new Error('APIキーが未登録です。右上の「⚙ 設定」からAPIキーを登録してください。');
  }
  const system = "あなたはレシピ情報を抽出するアシスタントです。出力は必ず有効なJSONオブジェクトのみとし、説明文やMarkdownのコードフェンスは一切含めないでください。形式: {\"title\": string, \"servings\": string, \"tags\": string[], \"ingredients\": [{\"name\": string, \"amount\": string}], \"steps\": string[], \"notes\": string}。読み取れない項目は空文字または空配列にしてください。分量や単位は amount に日本語でそのまま入れてください。";
  const userContent = [];
  if(image){
    userContent.push({ type:'image', source:{ type:'base64', media_type: mediaType, data: image } });
  }
  const instruction = text
    ? `以下はメモアプリからコピーしたレシピのテキストです。構造化されたレシピ情報として抽出してください。\n\n${text}`
    : '画像は料理本またはレシピメモのページです。この画像からレシピ情報を抽出してください。';
  userContent.push({ type:'text', text: instruction });

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model:"claude-sonnet-4-6",
      max_tokens:1500,
      system,
      messages:[{ role:'user', content:userContent }]
    })
  });
  const data = await response.json().catch(()=>null);
  if(!response.ok){
    let msg = (data && data.error && data.error.message) ? data.error.message : `APIエラー (status ${response.status})`;
    if(response.status === 401) msg = 'APIキーが正しくないようです。「⚙ 設定」から登録し直してください。';
    if(response.status === 429) msg = '利用制限に達しました。しばらく待ってからお試しください。';
    throw new Error(msg);
  }
  if(!data) throw new Error('応答を読み取れませんでした。');
  const rawText = (data.content||[]).map(b=>b.text||'').join('\n');
  if(!rawText.trim()) throw new Error('AIからの応答が空でした。');
  let cleaned = rawText.replace(/```json|```/g,'').trim();
  const first = cleaned.indexOf('{'), last = cleaned.lastIndexOf('}');
  if(first>-1 && last>first) cleaned = cleaned.slice(first, last+1);
  let parsed;
  try{ parsed = JSON.parse(cleaned); }
  catch(e){ throw new Error('AIの応答を読み取れませんでした: ' + rawText.slice(0,150)); }
  return {
    id:null,
    title: parsed.title||'',
    servings: parsed.servings||'',
    tags: Array.isArray(parsed.tags)?parsed.tags:[],
    ingredients: (Array.isArray(parsed.ingredients)&&parsed.ingredients.length ? parsed.ingredients : [{name:'',amount:''}]).map(i=>({name:i.name||'',amount:i.amount||''})),
    steps: (Array.isArray(parsed.steps)&&parsed.steps.length ? parsed.steps : ['']),
    notes: parsed.notes||''
  };
}

/* ---------------- Free OCR (Tesseract.js) ---------------- */

// Photos of recipe cards are often low-contrast, unevenly lit, or small in the
// frame. Upscaling, converting to greyscale and stretching contrast measurably
// improves what Tesseract can recognise.
// Dense pages (org charts, tables, whole book pages) carry small text, so they
// are enlarged further. A total-pixel ceiling keeps memory in check on phones.
function ocrTargetSize(img){
  const longEdge = Math.max(img.width, img.height);
  const target = state.ocrDense ? 3200 : 2000;
  let scale = Math.min(3.5, Math.max(1, target / longEdge));
  const MAX_PIXELS = 12e6;
  if(img.width * img.height * scale * scale > MAX_PIXELS){
    scale = Math.sqrt(MAX_PIXELS / (img.width * img.height));
  }
  return {
    w: Math.max(1, Math.round(img.width * scale)),
    h: Math.max(1, Math.round(img.height * scale))
  };
}

function preprocessForOcr(dataUri){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onerror = ()=>resolve(dataUri); // fall back to the original
    img.onload = ()=>{
      try{
        // Tesseract does best when text is reasonably large; scale small
        // images up towards ~2000px on the long edge.
        const { w, h } = ocrTargetSize(img);

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);

        const imageData = ctx.getImageData(0, 0, w, h);
        const d = imageData.data;

        // Pass 1: greyscale, and collect a luminance histogram.
        const hist = new Uint32Array(256);
        for(let i=0; i<d.length; i+=4){
          const g = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) | 0;
          d[i] = d[i+1] = d[i+2] = g;
          hist[g]++;
        }

        // Find the 2nd/98th percentile to ignore outliers, then stretch that
        // range across the full 0-255 scale.
        const total = w * h;
        // Printed menus are often very pale: a narrow percentile window would
        // dismiss that faint ink as background, so the darkest 0.5% anchors it.
        const lowCut = total * 0.005, highCut = total * 0.985;
        let acc = 0, lo = 0, hi = 255;
        for(let v=0; v<256; v++){ acc += hist[v]; if(acc >= lowCut){ lo = v; break; } }
        acc = 0;
        for(let v=0; v<256; v++){ acc += hist[v]; if(acc >= highCut){ hi = v; break; } }
        if(hi - lo < 24){ lo = 0; hi = 255; } // near-flat image: leave it alone

        const range = hi - lo;
        const lut = new Uint8Array(256);
        for(let v=0; v<256; v++){
          let n = ((v - lo) / range) * 255;
          n = n < 0 ? 0 : n > 255 ? 255 : n;
          // Mild S-curve: darkens ink, brightens paper, without hard clipping
          // that would destroy thin strokes in kanji.
          const s = n / 255;
          lut[v] = Math.round((s < 0.5 ? 2*s*s : 1 - 2*(1-s)*(1-s)) * 255);
        }
        for(let i=0; i<d.length; i+=4){
          const v = lut[d[i]];
          d[i] = d[i+1] = d[i+2] = v;
        }

        ctx.putImageData(imageData, 0, 0);
        resolve(canvas.toDataURL('image/png')); // PNG: lossless for OCR
      }catch(e){
        resolve(dataUri);
      }
    };
    img.src = dataUri;
  });
}

// A second preprocessing variant. Contrast stretching suits photographs,
// while hard binarisation suits flat, evenly-lit text such as screenshots and
// printed pages. Whichever reads with more confidence is used.
function binarizeForOcr(dataUri){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onerror = ()=>resolve(dataUri);
    img.onload = ()=>{
      try{
        const { w, h } = ocrTargetSize(img);

        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);

        const imageData = ctx.getImageData(0, 0, w, h);
        const d = imageData.data;
        const hist = new Uint32Array(256);
        for(let i=0;i<d.length;i+=4){
          const g = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) | 0;
          d[i]=d[i+1]=d[i+2]=g;
          hist[g]++;
        }

        // Otsu's method: pick the threshold that best separates ink from paper.
        const total = w*h;
        let sum = 0;
        for(let v=0;v<256;v++) sum += v*hist[v];
        let sumB=0, wB=0, best=0, thr=128;
        for(let v=0;v<256;v++){
          wB += hist[v];
          if(!wB) continue;
          const wF = total - wB;
          if(!wF) break;
          sumB += v*hist[v];
          const mB = sumB/wB, mF = (sum-sumB)/wF;
          const between = wB*wF*(mB-mF)*(mB-mF);
          if(between > best){ best = between; thr = v; }
        }

        for(let i=0;i<d.length;i+=4){
          const v = d[i] > thr ? 255 : 0;
          d[i]=d[i+1]=d[i+2]=v;
        }
        ctx.putImageData(imageData, 0, 0);
        resolve(canvas.toDataURL('image/png'));
      }catch(e){ resolve(dataUri); }
    };
    img.src = dataUri;
  });
}

// The OCR engine is about 1MB, so it is fetched the first time a photo is
// actually read rather than on every app start. Startup no longer waits for it.
const TESSERACT_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@7/dist/tesseract.min.js';
let tesseractPromise = null;

function loadTesseract(){
  if(typeof Tesseract !== 'undefined') return Promise.resolve();
  if(tesseractPromise) return tesseractPromise;
  tesseractPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = TESSERACT_URL;
    s.async = true;
    s.onload = ()=>resolve();
    s.onerror = ()=>{
      tesseractPromise = null;   // allow a retry later
      reject(new Error('読み取りエンジンを読み込めませんでした。通信環境をご確認ください。'));
    };
    document.head.appendChild(s);
  });
  return tesseractPromise;
}

let ocrWorkerPromise = null;
function getOcrWorker(){
  if(!ocrWorkerPromise){
    ocrWorkerPromise = Tesseract.createWorker(['jpn','jpn_vert','eng'], 1, {
      logger: m=>{
        if(m.status && typeof m.progress === 'number'){
          state.ocrStatus = m.status;
          state.ocrProgress = m.progress;
          updateOcrProgressUI();
        }
      }
    }).then(async worker=>{
      // Treat the image as a block of text rather than hunting for sparse
      // words, and keep Japanese punctuation/units intact.
      await worker.setParameters({
        preserve_interword_spaces: '1',
        // Photos carry no DPI metadata; without a hint Tesseract mis-judges
        // text size and accuracy drops noticeably.
        user_defined_dpi: '300',
        tessedit_pageseg_mode: '6' // assume a single uniform block of text
      });
      return worker;
    });
  }
  return ocrWorkerPromise;
}

function updateOcrProgressUI(){
  const bar = document.getElementById('ocr-progress-bar');
  const label = document.getElementById('ocr-progress-label');
  if(!bar || !label) return;
  const pct = Math.round((state.ocrProgress||0) * 100);
  bar.style.width = pct + '%';
  const statusJa = {
    'loading tesseract core': '読み取りエンジンを準備中',
    'initializing tesseract': '初期化中',
    'loading language traineddata': '日本語データを読み込み中（初回のみ時間がかかります）',
    'initializing api': '準備中',
    'recognizing text': '文字を認識中'
  }[state.ocrStatus] || state.ocrStatus || '処理中';
  const which = (state.ocrTotal > 1 && state.ocrIndex)
    ? `（${state.ocrIndex}/${state.ocrTotal}枚目）` : '';
  label.textContent = `${statusJa}${which}… ${pct}%`;
}

// Recipe photos vary a lot: a tight recipe card reads best as one block
// (PSM 6), while a screenshot with headers and columns reads best with
// automatic layout detection (PSM 3). Try the first, and if confidence is
// poor, try the other and keep whichever did better.
// Recipe photos vary enormously, so several readings are attempted and the
// most confident one wins. Cheap attempts run first and the rest are skipped
// once a clearly good result appears, keeping the common case fast.
async function recognizeAdaptive(worker, sourceDataUri, onProgress){
  const attempt = async (image, psm)=>{
    await worker.setParameters({ tessedit_pageseg_mode: psm });
    const { data } = await worker.recognize(image);
    return {
      text: (data && data.text ? data.text : '').trim(),
      confidence: (data && typeof data.confidence === 'number') ? data.confidence : 0
    };
  };

  const better = (a, b)=>{
    if(!a) return b;
    if(!b) return a;
    // Clear confidence win, or a tie broken by how much text was recovered.
    if(b.confidence > a.confidence + 3) return b;
    if(Math.abs(b.confidence - a.confidence) <= 3 && b.text.length > a.text.length) return b;
    return a;
  };

  const stretched = await preprocessForOcr(sourceDataUri);

  // Charts and forms scatter short labels across the page rather than running
  // them into paragraphs, so sparse-text mode is tried first for those.
  if(state.ocrDense){
    let best = await attempt(stretched, '11');   // sparse text, no layout assumptions
    if(onProgress) onProgress('図表として読み取り中');
    try{ best = better(best, await attempt(stretched, '4')); }catch(e){}
    try{ best = better(best, await attempt(stretched, '5')); }catch(e){}   // vertical   // columns
    try{ best = better(best, await attempt(stretched, '3')); }catch(e){}
    if(best.confidence < 70){
      if(onProgress) onProgress('白黒化して再読み取り中');
      try{
        const binary = await binarizeForOcr(sourceDataUri);
        best = better(best, await attempt(binary, '11'));
        best = better(best, await attempt(binary, '4'));
      }catch(e){}
    }
    return best;
  }

  // Pass 1: block layout on the contrast-stretched image (the common case).
  let best = await attempt(stretched, '6');
  if(best.confidence >= 82 && best.text.length >= 20) return best;

  // Pass 2: vertical block. Japanese menus and recipe books are usually set
  // vertically, which horizontal modes read as scrambled fragments.
  if(onProgress) onProgress('縦書きとして再読み取り中');
  try{ best = better(best, await attempt(stretched, '5')); }catch(e){}
  if(best.confidence >= 80 && best.text.length >= 20) return best;

  // Pass 3: automatic layout detection, for pages with columns or headings.
  if(onProgress) onProgress('レイアウトを変えて再読み取り中');
  try{ best = better(best, await attempt(stretched, '3')); }catch(e){}
  if(best.confidence >= 78 && best.text.length >= 20) return best;

  // Pass 3: hard binarisation, which suits screenshots and flat printed text.
  if(onProgress) onProgress('画像を白黒化して再読み取り中');
  try{
    const binary = await binarizeForOcr(sourceDataUri);
    best = better(best, await attempt(binary, '6'));
    if(best.confidence < 70){
      best = better(best, await attempt(binary, '3'));
    }
  }catch(e){}

  return best;
}

// iOS suspends JavaScript once the app leaves the foreground, so the only
// reliable way to let a long read finish is to stop the screen sleeping.
let ocrWakeLock = null;
async function acquireWakeLock(){
  try{
    if('wakeLock' in navigator){
      ocrWakeLock = await navigator.wakeLock.request('screen');
      // The lock is dropped whenever the app is hidden; take it again on return.
      document.addEventListener('visibilitychange', reacquireWakeLock);
    }
  }catch(e){ /* unsupported or refused: reading still works, screen may sleep */ }
}
async function reacquireWakeLock(){
  if(document.visibilityState === 'visible' && state.ocrBusy && !ocrWakeLock){
    try{ ocrWakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
  }
}
async function releaseWakeLock(){
  try{
    document.removeEventListener('visibilitychange', reacquireWakeLock);
    if(ocrWakeLock){ await ocrWakeLock.release(); }
  }catch(e){}
  ocrWakeLock = null;
}

// Each page is written to storage the moment it finishes, so a suspended app
// never loses work that was already done.
const OCR_PROGRESS_KEY = 'ocrProgress';
function saveOcrProgress(pages, total){
  try{
    window.localStorage.setItem(OCR_PROGRESS_KEY, JSON.stringify({
      pages, total, at: Date.now()
    }));
  }catch(e){}
}
function loadOcrProgress(){
  try{
    const raw = window.localStorage.getItem(OCR_PROGRESS_KEY);
    if(!raw) return null;
    const p = JSON.parse(raw);
    // Anything older than a couple of hours is stale.
    if(!p || !Array.isArray(p.pages) || Date.now() - (p.at||0) > 2*60*60*1000) return null;
    return p;
  }catch(e){ return null; }
}
function clearOcrProgress(){
  try{ window.localStorage.removeItem(OCR_PROGRESS_KEY); }catch(e){}
}

async function runOcr(){
  const shots = state.shots || [];
  if(!shots.length) return;

  if(typeof Tesseract === 'undefined'){
    state.ocrBusy = true;
    state.ocrStatus = '読み取りエンジンを準備中';
    state.ocrProgress = 0;
    render();
    try{
      await loadTesseract();
    }catch(e){
      state.ocrBusy = false;
      state.banner = {type:'error', text: e.message};
      render();
      return;
    }
  }
  state.ocrBusy = true;
  state.ocrProgress = 0;
  state.ocrStatus = '';
  state.ocrPages = [];
  state.ocrText = '';
  state.ocrIndex = 0;
  state.ocrTotal = shots.length;
  state.banner = null;
  render();

  await acquireWakeLock();

  try{
    const worker = await getOcrWorker();
    // Resume from wherever a previous, interrupted run got to.
    const prior = loadOcrProgress();
    const pages = (prior && prior.total === shots.length) ? prior.pages.slice() : [];
    const weak = [];
    for(let i=pages.length; i<shots.length; i++){
      state.ocrIndex = i + 1;
      updateOcrProgressUI();
      const res = await recognizeAdaptive(worker, shots[i].dataUri, (msg)=>{
        state.ocrStatus = msg;
        updateOcrProgressUI();
      });
      pages.push(res.text);
      saveOcrProgress(pages, shots.length);
      if(res.confidence && res.confidence < 60) weak.push(i + 1);
    }
    clearOcrProgress();
    state.ocrPages = pages;
    state.ocrText = pages
      .map((t,i)=> shots.length > 1 ? `----- 画像 ${i+1} -----\n${t}` : t)
      .join('\n\n')
      .trim();
    if(!state.ocrText){
      state.banner = {type:'info', text:'文字を認識できませんでした。明るい場所で撮り直すか、文字が大きく写るようにしてみてください。'};
    }else if(weak.length){
      state.banner = {type:'info', text:`${weak.join('、')}枚目の認識精度が低めです。誤りがないか特に注意して確認してください。`};
    }
  }catch(e){
    state.banner = {type:'error', text:'読み取りに失敗しました: ' + (e && e.message ? e.message : '不明なエラー')};
  }
  await releaseWakeLock();
  state.ocrBusy = false;
  render();
}

const RECIPE_SCHEMA_PROMPT = 'あなたは日本語のレシピを正確に読み取り、構造化する専門アシスタントです。\n' +

// Vision-capable models first, then text-only, so a temporary outage or a
// model being retired doesn't break the feature.
// Groq no longer hosts vision models (the Llama 4 multimodal models were
// retired), so images are handled by on-device OCR and only the resulting
// text is sent for structuring.
const GROQ_TEXT_MODELS = [
  'openai/gpt-oss-120b',   // flagship production model
  'qwen/qwen3.6-27b',      // fallback
  'openai/gpt-oss-20b'     // last resort, fastest

function parseRecipeJson(content){
  if(!content) throw new Error('応答が空でした。');
  let cleaned = String(content).replace(/```json|```/g,'').trim();
  const first = cleaned.indexOf('{'), last = cleaned.lastIndexOf('}');
  if(first>-1 && last>first) cleaned = cleaned.slice(first, last+1);
  let parsed;
  try{ parsed = JSON.parse(cleaned); }
  catch(e){ throw new Error('応答を読み取れませんでした: ' + String(content).slice(0,150)); }
  return normalizeParsedRecipe(parsed);
}

function normalizeParsedRecipe(parsed){
  return {
    id:null,
    title: parsed.title || '',
    reading: parsed.reading || '',
    photos: [],
    servings: parsed.servings || '',
    tags: Array.isArray(parsed.tags) ? parsed.tags.filter(t=>typeof t==='string') : [],
    ingredients: (Array.isArray(parsed.ingredients) && parsed.ingredients.length
      ? parsed.ingredients : [{name:'',amount:''}]
    ).map(i=>({ name:(i && i.name) || '', amount:(i && i.amount) || '' })),
    steps: (Array.isArray(parsed.steps) ? parsed.steps.filter(s=>typeof s==='string' && s.trim()) : []),
    notes: parsed.notes || ''
  };
}

function groqErrorMessage(status, data){
  const raw = (data && data.error && data.error.message) ? String(data.error.message) : '';
  let msg = raw || `APIエラー (status ${status})`;
  if(status === 401) msg = 'キーが正しくないようです。「⚙ 設定」から登録し直してください。';
  else if(status === 429) msg = '短時間に使いすぎました。1分ほど待ってからお試しください。';
  else if(status === 413){
    // Groq counts prompt tokens PLUS the reserved max_tokens against the
    // per-minute token allowance, so this fires even for short input.
    msg = '一度に処理できる量を超えました。1分ほど待つか、入力を少し減らしてお試しください。';
  }
  else if(status === 404) msg = 'AIモデルが見つかりません。アプリの更新が必要な可能性があります。';
  return msg;
}

// Groq's free tier counts prompt tokens PLUS the reserved max_tokens against a
// per-minute allowance that can be as low as 6,000. Reserving a large output
// therefore fails (HTTP 413) no matter how short the input is, so output size
// is capped here and reduced automatically if the limit is still hit.
const GROQ_MAX_TOKENS_CEILING = 3000;
const GROQ_MAX_TOKENS_FLOOR = 900;

function estimateTokens(text){
  // Japanese averages well under 2 characters per token; deliberately
  // pessimistic so the estimate never under-counts.
  return Math.ceil(String(text||'').length / 1.6);
}

async function callGroq(body){
  const key = getGroqKey();
  if(!key){
    throw new Error('Groqの無料APIキーが未登録です。「⚙ 設定」から登録してください。');
  }

  const promptChars = (body.messages||[])
    .map(m=>typeof m.content === 'string' ? m.content : JSON.stringify(m.content))
    .join('').length;
  const promptTokens = estimateTokens('x'.repeat(promptChars));

  // Never reserve more than the ceiling, and leave room for the prompt itself.
  let budget = Math.min(
    body.max_tokens || GROQ_MAX_TOKENS_CEILING,
    GROQ_MAX_TOKENS_CEILING,
    Math.max(GROQ_MAX_TOKENS_FLOOR, 5200 - promptTokens)
  );

  let lastErr = null;
  for(let attempt = 0; attempt < 3; attempt++){
    const payload = Object.assign({}, body, { max_tokens: Math.round(budget) });
    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + key
      },
      body: JSON.stringify(payload)
    });
    const data = await response.json().catch(()=>null);

    if(response.ok){
      return data && data.choices && data.choices[0] && data.choices[0].message
        ? data.choices[0].message.content : '';
    }

    const err = new Error(groqErrorMessage(response.status, data));
    err.status = response.status;
    lastErr = err;

    // A 413 here means the reserved output was too big: shrink and retry.
    if(response.status === 413 && budget > GROQ_MAX_TOKENS_FLOOR){
      budget = Math.max(GROQ_MAX_TOKENS_FLOOR, Math.floor(budget * 0.5));
      continue;
    }
    throw err;
  }
  throw lastErr || new Error('AIの呼び出しに失敗しました。');
}

// Plain text call to Claude, used only for the prep planner when the optional
// paid key is registered.
async function callClaudeRaw(system, user){
  const apiKey = getApiKey();
  if(!apiKey) throw new Error('APIキーが未登録です。');
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:4000,
      system,
      messages:[{ role:'user', content:user }]
    })
  });
  const data = await res.json().catch(()=>null);
  if(!res.ok){
    const m = (data && data.error && data.error.message) ? data.error.message : `APIエラー (status ${res.status})`;
    throw new Error(m);
  }
  return (data.content||[]).map(b=>b.text||'').join('\n');
}

async function buildPrepSchedule(input){
  const lines = [];
  lines.push(`出勤・作業開始時刻: ${input.start}`);
  if(input.lunch) lines.push(`昼の営業開始時刻: ${input.lunch}（この時刻までに昼の分を終える）`);
  if(input.dinner) lines.push(`夜の営業開始時刻: ${input.dinner}（この時刻までに夜の分を終える）`);
  lines.push(`厨房の人数: ${input.people}人`);
  if(input.burners) lines.push(`同時に使える火口の数: ${input.burners}口`);
  if(input.note) lines.push(`その他の条件: ${input.note}`);
  lines.push('');
  lines.push('【仕込みリスト】');
  lines.push(input.tasks);

  const userMsg = lines.join('\n');

  // Scheduling is the most reasoning-heavy task in the app, so use the
  // stronger paid model when a key is available, falling back to the free one.
  if(getApiKey()){
    try{
      const content = await callClaudeRaw(PREP_PLANNER_PROMPT, userMsg);
      let cleaned = String(content).replace(/```json|```/g,'').trim();
      const a = cleaned.indexOf('{'), b = cleaned.lastIndexOf('}');
      if(a>-1 && b>a) cleaned = cleaned.slice(a, b+1);
      const draft = normalizeParsedRecipe(JSON.parse(cleaned));
      draft.kind = 'schedule';
      if(!draft.title) draft.title = `${todayLabel()} の仕込み段取り`;
      if(!draft.servings){
        draft.servings = [input.lunch ? `昼 ${input.lunch}` : '', input.dinner ? `夜 ${input.dinner}` : '']
          .filter(Boolean).join(' / ');
      }
      return draft;
    }catch(e){ /* fall through to the free model */ }
  }

  let lastErr = null;
  for(const model of GROQ_TEXT_MODELS){
    try{
      const content = await callGroq({
        model,
        temperature: 0.2,
        max_tokens: 3000,
        response_format: { type: 'json_object' },
        messages: [
          { role: 'system', content: PREP_PLANNER_PROMPT },
          { role: 'user', content: userMsg }
        ]
      });
      let cleaned = String(content).replace(/```json|```/g,'').trim();
      const a = cleaned.indexOf('{'), b = cleaned.lastIndexOf('}');
      if(a>-1 && b>a) cleaned = cleaned.slice(a, b+1);
      const parsed = JSON.parse(cleaned);
      const draft = normalizeParsedRecipe(parsed);
      draft.kind = 'schedule';
      if(!draft.title) draft.title = `${todayLabel()} の仕込み段取り`;
      if(!draft.servings){
        draft.servings = [input.lunch ? `昼 ${input.lunch}` : '', input.dinner ? `夜 ${input.dinner}` : '']
          .filter(Boolean).join(' / ');
      }
      return draft;
    }catch(e){
      lastErr = e;
      if(e.status === 401 || e.status === 429) throw e;
    }
  }
  throw lastErr || new Error('段取りを作成できませんでした。');
}

async function structureManyWithGroq(pages){
  const joined = pages.map((p,i)=>`----- 画像 ${i+1} -----\n${p}`).join('\n\n');
  const instruction =
    '次は複数の画像から読み取ったテキストです。含まれているレシピをすべて抽出してください。'
    + '同じレシピが複数の画像にまたがっている場合は1件にまとめ、別々の料理なら別々のレシピに分けてください。\n'
    + '出力形式: {"recipes": [ 各レシピのオブジェクト ]}\n\n'
    + joined;

  let lastErr = null;
  for(const model of GROQ_TEXT_MODELS){
    try{
      const content = await callGroq({
        model,
        temperature: 0.1,
        max_tokens: 3000,
        response_format: { type: 'json_object' },
        messages: [
          { role: 'system', content: RECIPE_SCHEMA_PROMPT
              + '\n複数のレシピがある場合は {"recipes": [...]} の形で出力してください。' },
          { role: 'user', content: instruction }
        ]
      });
      let cleaned = String(content).replace(/```json|```/g,'').trim();
      const a = cleaned.indexOf('{'), b = cleaned.lastIndexOf('}');
      if(a>-1 && b>a) cleaned = cleaned.slice(a, b+1);
      const parsed = JSON.parse(cleaned);
      const list = Array.isArray(parsed.recipes) ? parsed.recipes : [parsed];
      const out = list
        .filter(r=>r && typeof r.title === 'string' && r.title.trim())
        .map(normalizeParsedRecipe);
      if(out.length) return out;
      throw new Error('レシピを抽出できませんでした。');
    }catch(e){
      lastErr = e;
      if(e.status === 401 || e.status === 429) throw e;
    }
  }
  throw lastErr || new Error('テキストから読み取れませんでした。');
}

// Structure raw text (OCR output, pasted notes, etc.) into recipe fields.
// Only text is sent — no image leaves the device on this path.
async function structureWithGroq(rawText){
  let lastErr = null;
  for(const model of GROQ_TEXT_MODELS){
    try{
      const content = await callGroq({
        model,
        temperature: 0.1,
        max_tokens: 2000,
        response_format: { type: 'json_object' },
        messages: [
          { role: 'system', content: RECIPE_SCHEMA_PROMPT },
          { role: 'user', content: '次のテキストからレシピ情報を抽出してください。\n\n' + rawText }
        ]
      });
      return parseRecipeJson(content);
    }catch(e){
      lastErr = e;
      if(e.status === 401 || e.status === 429) throw e;
    }
  }
  throw lastErr || new Error('テキストから読み取れませんでした。');
}

// OCR text -> Groq -> pre-filled recipe form, with the source photo attached.
// Turn the selected shots into compressed photos suitable for storing on a
// recipe (up to the per-recipe photo limit).
async function shotsAsRecipePhotos(){
  const out = [];
  for(const s of (state.shots||[]).slice(0, MAX_PHOTOS)){
    try{
      const resp = await fetch(s.dataUri);
      const blob = await resp.blob();
      const file = new File([blob], 'photo.jpg', { type: s.type || 'image/jpeg' });
      const plan = photoTargetFor_compat(out);
      out.push(await compressImage(file, plan.target, plan.maxPx));
    }catch(e){ /* non-critical */ }
  }
  return out;
}

function clearShotState(){
  state.shots = [];
  state.ocrText = '';
  state.ocrPages = [];
  state.ocrIndex = 0;
  state.ocrTotal = 0;
  state.photoBase64 = null;
  state.photoMediaType = null;
}

async function organizeOcrWithGroq(){
  const box = document.getElementById('ocr-text-box');
  const text = box ? box.value : state.ocrText;
  if(!text || !text.trim()){
    state.banner = {type:'error', text:'読み取ったテキストがありません。'};
    render();
    return;
  }

  state.busy = true;
  state.banner = {type:'info', text:'読み取った文字を材料・手順に整理しています…'};
  render();

  try{
    const pages = (state.ocrPages && state.ocrPages.length > 1)
      ? state.ocrPages
      : null;

    // Several photos may hold several recipes, so ask for a list in that case.
    const recipes = pages
      ? await structureManyWithGroq(pages)
      : [await structureWithGroq(text)];

    const photos = await shotsAsRecipePhotos();

    if(recipes.length === 1){
      const draft = recipes[0];
      draft.photos = photos;
      state.draft = draft;
      state.draftMode = 'review';
      state.busy = false;
      clearShotState();
      state.banner = {type:'success', text:'整理しました。内容を確認してから保存してください。'};
      setView('form');
      return;
    }

    // Multiple recipes: stage them so they can be reviewed one at a time.
    state.pendingRecipes = recipes.map((r,i)=>{
      // Give the first recipe the photos; the rest start without, since we
      // can't reliably tell which image belongs to which recipe.
      r.photos = (i === 0) ? photos : [];
      return r;
    });
    state.busy = false;
    clearShotState();
    state.banner = {type:'success', text:`${recipes.length}件のレシピを見つけました。1件ずつ確認して保存してください。`};
    setView('pending');
  }catch(e){
    state.busy = false;
    state.banner = {type:'error', text:'整理に失敗しました: ' + (e && e.message ? e.message : '不明なエラー')};
    render();
  }
}

async function useOcrTextInForm(){
  const box = document.getElementById('ocr-text-box');
  const text = box ? box.value : state.ocrText;
  const draft = emptyDraft();
  draft.notes = text;
  draft.photos = await shotsAsRecipePhotos();

  state.draft = draft;
  state.draftMode = 'add';
  clearShotState();
  state.banner = {type:'info', text:'読み取った文字をメモ欄に、写真も自動で添付しました。材料や手順を整理して保存してください。'};
  setView('form');
}

async function extractFromText(){
  const raw = state.lastPastedText;
  if(!raw || !raw.trim()){
    state.banner = {type:'error', text:'テキストを貼り付けてください。'};
    render(); return;
  }
  if(!getGroqKey() && !getApiKey()){
    state.banner = {type:'error', text:'この機能にはAPIキーの登録が必要です。「⚙ 設定」から無料のキーを登録してください。'};
    render(); return;
  }
  state.busy = true;
  state.banner = {type:'info', text:'テキストを解析しています…'};
  render();
  try{
    // Use the free option when it's available; fall back to the paid one.
    const draft = getGroqKey()
      ? await structureWithGroq(raw)
      : await callClaudeExtract({text: raw});
    state.draft = draft; state.draftMode = 'review'; state.busy = false;
    state.banner = {type:'success', text:'解析しました。内容を確認してから保存してください。'};
    state.view = 'form';
  }catch(e){
    state.busy = false;
    state.banner = {type:'error', text:'解析に失敗しました: ' + (e && e.message ? e.message : '不明なエラー')};
  }
  render();
}
