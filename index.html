      paint(items);
    }catch(e){
      status.style.color = 'var(--clay)';
      status.textContent = navigator.onLine
        ? ((e && e.message) ? e.message : '読み込めませんでした。')
        : 'オフラインでは配信を受け取れません。通信できるときにお試しください。';
    }
    btn.disabled = false;
  };
}

// Walk every menu (昼定食・おばんざい・会席…) and fill in links to recipes
// whose names match. Shared by the 管理 screen's button and by the delivery
// import, which runs it automatically once new recipes have landed.
async function relinkAllMenus(){
  let changed = 0, links = 0, failed = 0;
  for(const r of state.recipes){
    if(kindOf(r) === 'recipe') continue;          // recipes have no menu
    const before = normalizeMenu(r.menu);
    if(!before.length) continue;
    const after = autoLinkMenu(before);
    const added = after.filter((m,i)=> m.recipeId && !before[i].recipeId).length;
    if(!added) continue;
    try{
      await saveRecipe({ ...r, menu: after });
      changed++; links += added;
    }catch(e){ failed++; }
  }
  return { changed, links, failed };
}

/* ---------------- English for guests (英語の説明) ----------------
   Overseas guests ask what a dish is. The explanation is written once and
   stored on the recipe, so it is on the phone in the dining room whether or
   not there is a signal — a kitchen is the wrong place to wait on an API. */

// A fixed vocabulary keeps the labels consistent and lets the model pick
// rather than invent. Free-text allergy wording is exactly what a guest
// cannot afford to have reworded differently every time.
const EN_ALLERGENS = [
  'Fish','Shellfish','Crustacean','Squid / Octopus','Egg','Dairy',
  'Wheat / Gluten','Soy','Sesame','Peanut','Tree nuts','Buckwheat',
  'Pork','Beef','Chicken','Alcohol'
];

function normalizeEn(en){
  if(!en || typeof en !== 'object') return null;
  const str = v => typeof v === 'string' ? v.trim() : '';
  const out = {
    title: str(en.title),
    desc: str(en.desc),
    allergens: Array.isArray(en.allergens)
      ? en.allergens.map(str).filter(a=>EN_ALLERGENS.includes(a)) : [],
    items: Array.isArray(en.items)
      ? en.items.map(it=>({ ja: str(it && it.ja), en: str(it && it.en), desc: str(it && it.desc) }))
                .filter(it=>it.ja || it.en) : [],
    madeAt: str(en.madeAt) || new Date().toISOString()
  };
  if(!out.title && !out.desc && !out.items.length) return null;
  return out;
}

const EN_DISH_PROMPT = `You write English explanations of Japanese dishes for overseas guests at a Japanese restaurant.

Rules:
- Plain, warm, spoken English a server can read aloud. No marketing language.
- "desc": 2 or 3 short sentences. Say what the dish is, the main ingredient, and how it is cooked. If the Japanese name has no common English equivalent, keep the Japanese word in romaji and explain it.
- Keep the romanised Japanese name in "title" followed by a plain English name in parentheses, e.g. "Buri Sansho-yaki (grilled yellowtail with sansho pepper)".
- "allergens": choose ONLY from this exact list, and only what is clearly present in the ingredients: ${JSON.stringify(EN_ALLERGENS)}. Dashi made with bonito counts as Fish. Soy sauce counts as Soy and Wheat / Gluten. Mirin and sake count as Alcohol. Never guess.
- Do not invent ingredients that are not listed.

Reply with JSON only: {"title": "...", "desc": "...", "allergens": ["..."]}`;

const EN_MENU_PROMPT = `You write English explanations of a Japanese restaurant's set menu for overseas guests.

Rules:
- Plain, warm, spoken English. No marketing language.
- For each course line, give "en" (a short English name, romaji kept where there is no equivalent) and "desc" (ONE short sentence on what it is).
- Keep the courses in the order given and return one entry per line, with "ja" copied exactly as given.
- Do not invent dishes or ingredients.

Reply with JSON only: {"title": "...", "items": [{"ja": "...", "en": "...", "desc": "..."}]}`;

function enDishInput(r){
  const L = [];
  L.push('料理名: ' + (r.title||''));
  if(r.servings) L.push('分量: ' + r.servings);
  if((r.tags||[]).length) L.push('区分: ' + r.tags.join('、'));
  const ing = (r.ingredients||[]).filter(i=>i && i.name);
  if(ing.length) L.push('材料: ' + ing.map(i=>i.name + (i.amount? '（'+i.amount+'）':'')).join('、'));
  const steps = (r.steps||[]).filter(Boolean);
  if(steps.length) L.push('作り方: ' + steps.join(' / '));
  return L.join('\n');
}

function enMenuInput(r){
  const L = ['献立名: ' + (r.title||'')];
  if(r.servings) L.push('日付・回: ' + r.servings);
  L.push('品目:');
  (r.menu||[]).forEach(m=>{ if(m && m.name) L.push('- ' + m.name); });
  return L.join('\n');
}

// Dish names also appear as menu lines, so a dish that already has its own
// English text can fill a menu line without asking the model again.
function enFromLinkedRecipe(name, recipeId){
  if(recipeId){
    const hit = state.recipes.find(x=>x.id===recipeId);
    if(hit && hit.en && (hit.en.title || hit.en.desc)) return hit.en;
  }
  const key = menuMatchKey(name);
  if(!key) return null;
  const hit = state.recipes.find(x=>kindOf(x)==='recipe' && x.en && menuMatchKey(x.title)===key);
  return hit ? hit.en : null;
}

async function askForJson(system, user){
  if(getApiKey()){
    try{
      let t = String(await callClaudeRaw(system, user)).replace(/```json|```/g,'').trim();
      const a = t.indexOf('{'), b = t.lastIndexOf('}');
      if(a>-1 && b>a) t = t.slice(a, b+1);
      return JSON.parse(t);
    }catch(e){ /* fall through to the free model */ }
  }
  let lastErr = null;
  for(const model of GROQ_TEXT_MODELS){
    try{
      const content = await callGroq({
        model, temperature: 0.2, max_tokens: 2500,
        response_format: { type: 'json_object' },
        messages: [{ role:'system', content: system }, { role:'user', content: user }]
      });
      let t = String(content).replace(/```json|```/g,'').trim();
      const a = t.indexOf('{'), b = t.lastIndexOf('}');
      if(a>-1 && b>a) t = t.slice(a, b+1);
      return JSON.parse(t);
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('英語の説明を作れませんでした。');
}

async function buildEnglish(r){
  const isMenu = kindConf(r).usesMenu;
  if(isMenu){
    const lines = (r.menu||[]).filter(m=>m && m.name);
    // Reuse what is already written before spending a call.
    const known = lines.map(m=>{
      const e = enFromLinkedRecipe(m.name, m.recipeId);
      return e ? { ja: m.name, en: e.title, desc: e.desc } : null;
    });
    if(known.every(Boolean) && known.length){
      return normalizeEn({ title: r.title, items: known });
    }
    const raw = await askForJson(EN_MENU_PROMPT, enMenuInput(r));
    const items = Array.isArray(raw.items) ? raw.items : [];
    // Keep the app's own order and names; only take the English from the model.
    const merged = lines.map((m,i)=>{
      const hit = items.find(x=> x && String(x.ja||'').trim() === m.name) || items[i] || {};
      return { ja: m.name, en: hit.en || '', desc: hit.desc || '' };
    });
    return normalizeEn({ title: raw.title || r.title, items: merged });
  }
  const raw = await askForJson(EN_DISH_PROMPT, enDishInput(r));
  return normalizeEn({ title: raw.title, desc: raw.desc, allergens: raw.allergens });
}

function renderEnPanel(r){
  const en = normalizeEn(r.en);
  const open = state.enOpen === r.id;

    : `<p class="en-desc">${esc(en.desc)}</p>
       ${en.allergens.length ? `<div class="en-aller">
          <span class="en-aller-label">Contains</span>
          ${en.allergens.map(a=>`<span class="en-chip">${esc(a)}</span>`).join('')}
        </div>` : ''}`;

  return `<div class="en-panel">
    <div class="en-head">English</div>
    <div class="en-title">${esc(en.title || r.title)}</div>
    ${body}
    <div class="row" style="margin-top:14px; flex-wrap:wrap">
      <button class="mini-btn" id="en-edit">文章を直す</button>
      <button class="mini-btn" id="en-redo" ${noKey?'disabled':''}>作り直す</button>
      <button class="mini-btn" id="en-copy">文章をコピー</button>
      <span id="en-status" style="font-size:12px"></span>
    </div>
    <div id="en-edit-slot"></div>
  </div>`;
}

function enPlainText(r){
  const en = normalizeEn(r.en); if(!en) return '';
  const L = [en.title || r.title, ''];
  if(en.desc) L.push(en.desc);
  en.items.forEach((it,i)=>{
    L.push(`${i+1}. ${it.en || it.ja}`);
    if(it.desc) L.push(`   ${it.desc}`);
  });
  if(en.allergens.length) L.push('', 'Contains: ' + en.allergens.join(', '));
  return L.join('\n');
}

/* ---------------- Delivery (配信) ----------------
   Import codes published alongside the app under _import/. The phone fetches
   them itself, so nothing has to be copied by hand — hand-transcribing a
   20,000-character code was how codes got corrupted before. */

const FEED_DIR  = '_import/';
const FEED_DONE = 'recipe-feed-done';

function feedDone(){
  try{ return JSON.parse(localStorage.getItem(FEED_DONE) || '[]'); }
  catch(e){ return []; }
}
function markFeedDone(file){
  try{
    const list = feedDone();
    if(!list.includes(file)){ list.push(file); localStorage.setItem(FEED_DONE, JSON.stringify(list)); }
  }catch(e){}
}

// ?probe= is sent straight to the network by the service worker and never
// stored, so the list is always the one that is actually published.
function feedUrl(path){
  return FEED_DIR + path + (path.includes('?') ? '&' : '?') + 'probe=' + Date.now();
}

async function loadFeed(){
  const res = await fetch(feedUrl('index.json'), { cache: 'no-store' });
  if(!res.ok) throw new Error('配信リストが見つかりません（' + res.status + '）');
  const data = await res.json();
  if(!Array.isArray(data)) throw new Error('配信リストの形式が違います');
  return data;
}

function decodeImportCode(code){
  // Codes are base64url-encoded UTF-8 JSON produced in the Claude chat.
  const trimmed = code.trim();
  // Allow raw JSON too, in case it is pasted directly.
  if(trimmed.startsWith('{') || trimmed.startsWith('[')) return trimmed;
  let b64 = trimmed.replace(/-/g,'+').replace(/_/g,'/').replace(/\s+/g,'');
  while(b64.length % 4){ b64 += '='; }
  return decodeURIComponent(escape(atob(b64)));
}

async function importFromCode(rawOverride, statusEl, opts){
  const raw = String(rawOverride != null ? rawOverride
    : (document.getElementById('import-code').value||'')).trim();
  const status = statusEl || document.getElementById('import-status');
  opts = opts || {};
  if(!raw){
    status.textContent = 'コードを貼り付けてください。';
    status.style.color = 'var(--clay)';
    return;
  }

  let parsed;
  try{
    parsed = JSON.parse(decodeImportCode(raw));
  }catch(e){
    status.textContent = 'コードを読み取れませんでした。全体がコピーされているか確認してください。';
    status.style.color = 'var(--clay)';
    return;
  }

  // Update-style code: match existing recipes by title and patch fields,
  // rather than adding new ones.
  if(parsed && !Array.isArray(parsed) && parsed.op === 'update' && Array.isArray(parsed.items)){
    return applyUpdateCode(parsed.items, status, opts);
  }

  const items = Array.isArray(parsed) ? parsed : [parsed];
  const valid = items.filter(r => r && typeof r.title === 'string' && r.title.trim());
  if(!valid.length){
    status.textContent = 'レシピが含まれていないようです。';
    status.style.color = 'var(--clay)';
    return;
  }

  status.textContent = `${valid.length}件を登録中…`;
  status.style.color = 'var(--ink-soft)';

  let saved = 0;
  const failures = [];
  for(const r of valid){
    const recipe = {
      id: r.id || uid(),
      kind: r.kind || 'recipe',
      menu: normalizeMenu(r.menu),
      stock: normalizeStock(r.stock),
      scope: r.scope || '',
      title: r.title || '',
      reading: r.reading || '',
      photos: Array.isArray(r.photos) ? r.photos : [],
      servings: r.servings || '',
      tags: Array.isArray(r.tags) ? r.tags : [],
      ingredients: Array.isArray(r.ingredients)
        ? r.ingredients.map(i=>({ name: (i && i.name) || '', amount: (i && i.amount) || '' }))
        : [],
      steps: Array.isArray(r.steps) ? r.steps.filter(s=>typeof s === 'string') : [],
      notes: r.notes || '',
      en: normalizeEn(r.en),
      createdAt: r.createdAt || new Date().toISOString()
    };
    try{
      await saveRecipe(recipe);
      saved++;
    }catch(e){
      failures.push(recipe.title);
    }
  }

  // Menus added earlier do not link themselves to recipes that only arrive
  // now, so a delivery import closes that gap on the spot.
  let linkNote = '';
  if(saved && opts.relink){
    status.textContent = '献立と紐づけ中…';
    try{
      const { links } = await relinkAllMenus();
      if(links) linkNote = ` 献立の${links}品目をレシピに紐づけました。`;
    }catch(e){}
  }

  if(saved && opts.onSaved){ try{ opts.onSaved(saved); }catch(e){} }

  if(saved && !failures.length){
    state.banner = {type:'success', text:`${saved}件のレシピを登録しました。${linkNote}`};
    setView('list');
  }else if(saved){
    state.banner = {type:'info', text:`${saved}件を登録しました。${failures.length}件は失敗しました（${esc(failures.join('、'))}）。${linkNote}`};
    setView('list');
  }else{
    status.textContent = '登録に失敗しました。通信環境を確認してもう一度お試しください。';
    status.style.color = 'var(--clay)';
  }
}

// Patch existing recipes (matched by title) without creating duplicates.
async function applyUpdateCode(items, status, opts){
  opts = opts || {};
  status.textContent = '照合中…';
  status.style.color = 'var(--ink-soft)';

  const norm = s => String(s||'').replace(/[\s　]/g,'').toLowerCase();
  let updated = 0;
  const notFound = [];

  for(const it of items){
    if(!it || !it.title) continue;
    const target = state.recipes.find(r => norm(r.title) === norm(it.title));
    if(!target){ notFound.push(it.title); continue; }

    const patched = Object.assign({}, target);
    if(typeof it.reading === 'string') patched.reading = it.reading;
    if(typeof it.newTitle === 'string' && it.newTitle.trim()) patched.title = it.newTitle;
    if(it.en){ const en = normalizeEn(it.en); if(en) patched.en = en; }

    try{
      await saveRecipe(patched);
      updated++;
    }catch(e){
      notFound.push(it.title + '（保存失敗）');
    }
  }

  if(updated && opts.onSaved){ try{ opts.onSaved(updated); }catch(e){} }

  if(updated && !notFound.length){
    state.banner = {type:'success', text:`${updated}件のレシピを更新しました。`};
    setView('list');
  }else if(updated){
    state.banner = {type:'info', text:`${updated}件を更新しました。見つからなかったもの: ${notFound.join('、')}`};
    setView('list');
  }else{
    status.innerHTML = `一致するレシピが見つかりませんでした。<br>レシピ名が変更されている可能性があります（${esc(notFound.join('、'))}）。`;
    status.style.color = 'var(--clay)';
  }
}

// Reconnecting without a restart: the SDK is told to bring its network back
// up and the listeners are re-attached, so data refreshes straight away.
async function reconnectNow(){
  state.reconnecting = true;
  render();
  try{
    await enableNetwork(db);
    if(state.user) subscribeNotebooks();
    state.offline = !navigator.onLine;
    state.banner = {type:'success', text:'オンラインに接続しました。'};
  }catch(e){
    state.banner = {type:'error', text:'接続できませんでした。電波の状況をご確認ください。'};
  }
  state.reconnecting = false;
  render();
}

function updateOnlineState(){
  const off = !navigator.onLine;
  if(state.offline !== off){
    state.offline = off;
    if(off){
      state.banner = {type:'info', text:'オフラインです。閲覧・編集・写真の追加はこのまま行えます。変更は通信が戻ったときに自動で同期されます。'};
      render();
    }else{
      // Coming back online: reattach at once rather than waiting for the
      // SDK's own retry schedule.
      reconnectNow();
    }
  }
}
window.addEventListener('online', updateOnlineState);
window.addEventListener('offline', updateOnlineState);

// Cache the app shell so it launches without a connection.
// Offline support is easy to break without noticing, so its state is tracked
// and surfaced in Settings rather than failing silently.
state.swStatus = 'unknown';

// The worker is registered in the head script above, before any import runs.
// Here we only wait for the outcome and act on it.
(async ()=>{
  try{
    await window.__swReady;
    if('serviceWorker' in navigator){
      try{ await navigator.serviceWorker.ready; }catch(e){}
      // Registered is not the same as controlling. Give control a moment to
      // transfer rather than assuming it.
      if(!navigator.serviceWorker.controller){
        await Promise.race([
          new Promise(res=>navigator.serviceWorker.addEventListener('controllerchange', res, { once:true })),
          new Promise(res=>setTimeout(res, 4000))
        ]);
      }
    }
    state.swStatus = window.__swStatus || 'unknown';

    // iOS evicts storage after about seven days without use, so the cache is
    // checked on every launch, not only on first install. The worker owns the
    // cache and repairs itself, rather than the page writing to the same cache
    // from the outside and the two drifting apart.
    if(navigator.serviceWorker && navigator.serviceWorker.controller && navigator.onLine){
      navigator.serviceWorker.controller.postMessage({ type:'warm-cache' });
    }

    // Warn once per launch when running as a browser tab on iOS. In that mode
    // iOS clears the saved copy after about a week, which is why offline kept
    // breaking again a few days after each fix.
    try{
      const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
               || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if(iOS && !isStandalone() && !state.banner){
        state.banner = { type:'info', text:'ブラウザのタブで開いています。この状態ではiPhoneが約7日で保存内容を消すため、圏外で開けなくなります。ホーム画面のアイコンから開いてください（⚙設定の「オフライン診断」に手順があります）。' };
        try{ render(); }catch(e){}
      }
    }catch(e){}
  }catch(err){
    state.swStatus = 'failed';
  }
})();

// ---------------------------------------------------------------------------
// Offline support.
//
// The cache is named exactly "recipe-notebook" (unversioned). An earlier
// build searched for names starting with "recipe-notebook-" (trailing hyphen),
// a leftover from the versioned era. That filter never matched, so the app
// always reported "not saved", re-downloaded everything on every launch, and
// the "save again" button cleared nothing. All three used the same wrong
// prefix; they now share one constant.
const CACHE_NAME = "recipe-notebook";

// Clipboard with a fallback: the async API is refused in some iOS contexts.
async function copyPlainText(text){
  if(!text) return false;
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){ /* fall through */ }
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

// Everything the app needs to start with no connection at all.
function offlineAssets(){
  const base = new URL("./", location.href).href;
  return [
    base,                                   // the page itself
    base + "manifest.webmanifest",
    base + "icon-192.png",
    base + "apple-touch-icon.png",
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
  ];
}

// True when the app was launched from the Home Screen icon as a web app
// rather than as a Safari tab. This is the single biggest factor on iOS:
// a bookmark gets no service worker launch and its storage is wiped after
// seven days, so it breaks again roughly every week.
function isStandalone(){
  try{
    if(window.navigator.standalone === true) return true;
    if(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return true;
    if(window.matchMedia && window.matchMedia("(display-mode: fullscreen)").matches) return true;
  }catch(e){}
  return false;
}

async function warmOfflineCache(){
  try{
    if(!("caches" in window)) return false;
    const cache = await caches.open(CACHE_NAME);
    for(const u of offlineAssets()){
      try{
        const res = await fetch(u, { cache:"reload" });
        if(res && (res.ok || res.type === "opaque")) await cache.put(u, res.clone());
      }catch(e){ /* one missing asset must not abort the rest */ }
    }
    try{ localStorage.setItem("offlineWarmedAt", new Date().toISOString()); }catch(e){}
    return true;
  }catch(e){ return false; }
}

// Reports exactly what is and is not in place, so a failure can be read off
// the screen instead of guessed at.
async function offlineDiagnosis(){
  const d = {
    standalone: isStandalone(),
    swSupported: ("serviceWorker" in navigator),
    swControlling: ("serviceWorker" in navigator) && !!navigator.serviceWorker.controller,
    cachesSupported: ("caches" in window),
    cacheFound: false,
    missing: [],
    stored: 0,
    warmedAt: null,
    online: navigator.onLine
  };
  try{ d.warmedAt = localStorage.getItem("offlineWarmedAt"); }catch(e){}
  try{
    if(d.cachesSupported){
      const keys = await caches.keys();
      d.cacheFound = keys.includes(CACHE_NAME);
      if(d.cacheFound){
        const cache = await caches.open(CACHE_NAME);
        for(const u of offlineAssets()){
          const hit = await cache.match(u, { ignoreSearch:true });
          if(hit) d.stored++; else d.missing.push(u);
        }
      }else{
        d.missing = offlineAssets().slice();
      }
    }
  }catch(e){ d.error = (e && e.message) || String(e); }
  return d;
}

// Checks that the six deployed files actually exist on the server. An upload
// that misses a file looks exactly like a code bug from the phone, so this
// distinguishes the two without anyone having to guess.
async function probeServer(){
  const names = ['', 'sw.js', 'manifest.webmanifest', 'icon-192.png', 'icon-512.png', 'apple-touch-icon.png'];
  const base = new URL('./', location.href).href;
  const out = [];
  for(const n of names){
    const label = n || '(アプリ本体)';
    try{
      const res = await fetch(base + n + '?probe=' + Date.now(), { cache:'no-store' });
      const type = (res.headers.get('content-type') || '').split(';')[0];
      out.push({ name: label, status: res.status, type });
    }catch(e){
      out.push({ name: label, status: 0, type: '' });
    }
  }
  return out;
}

function probeText(rows, online){
  if(!online) return 'サーバー確認: オフラインのため未実施';
  const bad = rows.filter(r => r.status !== 200);
  const head = bad.length
    ? 'サーバー確認: ' + bad.length + '件に問題あり (NG)'
    : 'サーバー確認: 6件すべて配信中 (OK)';
  const lines = rows.map(r => {
    if(r.status === 200){
      // A worker served as text/html or text/plain will not register at all.
      const jsBad = r.name === 'sw.js' && r.type.indexOf('javascript') < 0;
      return '  ' + r.name + ': 200' + (jsBad ? ' ただし形式が ' + r.type + ' (NG)' : '');
    }
    return '  ' + r.name + ': ' + (r.status === 0 ? '到達できず' : r.status + ' (NG)');
  });
  return [head].concat(lines).join('\n');
}

function diagnosisText(d){
  const yn = b => b ? "OK" : "NG";
  const short = u => u.replace(/^https?:\/\/[^/]+\//, "").replace(/^$/, "(アプリ本体)") || "(アプリ本体)";
  return [
    "起動モード: " + (d.standalone ? "ホーム画面アプリ (OK)" : "ブラウザのタブ (NG)"),
    "Service Worker: " + (!d.swSupported ? "非対応" : (d.swControlling ? "動作中 (OK)" : "未適用 (NG)")),
    "保存領域: " + yn(d.cacheFound),
    "保存済みファイル: " + d.stored + " / " + offlineAssets().length,
    (d.missing.length ? "未保存: " + d.missing.map(short).join(", ") : "未保存: なし"),
    "最終保存: " + (d.warmedAt ? new Date(d.warmedAt).toLocaleString("ja-JP") : "記録なし"),
    "現在の通信: " + (d.online ? "オンライン" : "オフライン")
  ].join("\n");
}

async function checkOfflineReady(){
  const d = await offlineDiagnosis();
  if(!d.cachesSupported) return { ok:false, reason:"この端末は対応していません", d };
  if(!d.swSupported)     return { ok:false, reason:"この端末は対応していません", d };
  if(!d.swControlling)   return { ok:false, reason:"まだ有効になっていません（一度閉じて開き直してください）", d };
  if(!d.cacheFound)      return { ok:false, reason:"まだ保存されていません", d };
  if(d.missing.length)   return { ok:false, reason:"一部が未保存です（「保存し直す」を押してください）", d };
  if(!d.standalone)      return { ok:true,  reason:"保存は完了。ただしブラウザのタブで開いています", d };
  return { ok:true, reason:"オフラインで起動できます", d };
}
// Messages from the service worker: a new build is ready, or a cache repair
// has finished. The update is announced rather than forced, so a new version
// never interrupts someone mid-edit.
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message', (e)=>{
    const d = e.data || {};
    if(d.type === 'update-ready' && !state.updateReady){
      state.updateReady = true;
      try{ render(); }catch(err){}
    }
    if(d.type === 'warm-result' && d.report && !(d.report.missing||[]).length){
      try{ localStorage.setItem('offlineWarmedAt', new Date().toISOString()); }catch(err){}
    }
  });
}
</script>
